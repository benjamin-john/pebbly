<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F7A63">
<title>Qwixx Dice Roller</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --brand:#2F7A63; --brand-ink:#FFFFFF;
  --red:#D93F3B; --yellow:#F2C230; --green:#2E9B5A; --blue:#3570C9;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --brand:#6CC4A4; --brand-ink:#0F1F19; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font:800 28px/1.15 var(--head);margin:8px 0 4px}
.lead{margin:0 0 16px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}

/* Dice */
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (min-width:560px){ .dice{grid-template-columns:repeat(6,1fr)} }
.die{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.face{
  width:100%;aspect-ratio:1/1;border-radius:18%;padding:14%;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.12);
  --pip:#fff;
}
.die.white .face{background:#fff;border:1px solid #D5DCD9;--pip:#1F2A27}
.die.red .face{background:var(--red)}
.die.yellow .face{background:var(--yellow);--pip:#3A2E05}
.die.green .face{background:var(--green)}
.die.blue .face{background:var(--blue)}
.pip{width:72%;aspect-ratio:1/1;border-radius:50%;background:var(--pip);place-self:center;visibility:hidden}
.pip.on{visibility:visible}
.die .name{font-size:13px;font-weight:600;color:var(--muted)}
.die.off .face{opacity:.18;box-shadow:none}
.die.off .name{text-decoration:line-through;opacity:.6}
.face.blank .pip{visibility:hidden}
.face.blank::after{content:"?";grid-area:2/2;place-self:center;font:800 28px/1 var(--head);color:var(--pip);opacity:.35}
@keyframes tumble{0%{transform:rotate(0) scale(1)}35%{transform:rotate(-14deg) scale(.92)}70%{transform:rotate(10deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
.rolling .die:not(.off) .face{animation:tumble .35s ease-out}
@media (prefers-reduced-motion:reduce){ .rolling .die .face{animation:none} }

.roll{
  display:block;width:100%;min-height:56px;margin:16px 0 0;border:0;border-radius:14px;
  background:var(--brand);color:var(--brand-ink);font:800 20px/1 var(--head);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.roll:active{transform:scale(.98)}
.roll:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* Sums */
.sums{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.sums li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sums li:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.dot.white{background:#fff;border:1px solid #B4C2BC}
.dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)}
.dot.green{background:var(--green)} .dot.blue{background:var(--blue)}
.sums .lbl{flex:1}
.sums .val{font:800 22px/1 var(--head);font-variant-numeric:tabular-nums}
.sums .val small{font:500 14px/1 var(--body);color:var(--muted);margin:0 6px}
.sums li.off{opacity:.45}
.sums li.off .val{font:500 15px/1 var(--body)}

/* Row toggles */
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){ .rows{grid-template-columns:repeat(4,1fr)} }
.rowbtn{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--body);
  cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;
}
.rowbtn .state{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
.rowbtn[aria-pressed="false"]{border-style:dashed;color:var(--muted)}
.rowbtn[aria-pressed="false"] .dot{opacity:.3}
.rowbtn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{margin:10px 0 0;color:var(--muted);font-size:14px}
</style>
<script src="/keepawake.js"></script>
<script src="/nav.js"></script>
</head>
<body>
<main class="wrap">
  <h1>Qwixx Dice Roller</h1>
  <p class="lead">Roll all six dice from one phone and see every sum you can mark.</p>

  <section class="card" aria-label="Dice">
    <div class="dice" id="dice"></div>
    <button class="roll" id="rollBtn" type="button">Roll</button>
  </section>

  <section class="card">
    <h2>Sums</h2>
    <ul class="sums" id="sums" aria-live="polite"></ul>
  </section>

  <section class="card">
    <h2>Colors in play</h2>
    <div class="rows" id="rows"></div>
    <p class="hint">When a row gets locked, tap its color to take that die out of the game.</p>
  </section>
</main>

<script>
(function () {
  var DICE = [
    { key: 'w1', name: 'White', cls: 'white' },
    { key: 'w2', name: 'White', cls: 'white' },
    { key: 'red', name: 'Red', cls: 'red', color: true },
    { key: 'yellow', name: 'Yellow', cls: 'yellow', color: true },
    { key: 'green', name: 'Green', cls: 'green', color: true },
    { key: 'blue', name: 'Blue', cls: 'blue', color: true }
  ];
  var COLORS = DICE.filter(function (d) { return d.color; });
  // Which of the 9 grid cells hold a pip for each value.
  var PIPS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  var KEY = 'pebbly_qwixx';

  var state = { roll: {}, on: { red: true, yellow: true, green: true, blue: true } };
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.on) state = saved; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  function inPlay(d) { return !d.color || state.on[d.key]; }
  function rand() {
    var a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 6) + 1;
  }

  // Build the dice and toggles once.
  DICE.forEach(function (d) {
    var die = document.createElement('div');
    die.className = 'die ' + d.cls; die.id = 'die-' + d.key;
    var face = document.createElement('div'); face.className = 'face'; face.setAttribute('role', 'img');
    for (var i = 0; i < 9; i++) { var p = document.createElement('span'); p.className = 'pip'; face.appendChild(p); }
    var name = document.createElement('span'); name.className = 'name'; name.textContent = d.name;
    die.appendChild(face); die.appendChild(name); $('dice').appendChild(die);
  });
  COLORS.forEach(function (d) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'rowbtn'; b.id = 'row-' + d.key;
    b.innerHTML = '<span class="dot ' + d.cls + '"></span>' + d.name + '<span class="state"></span>';
    b.addEventListener('click', function () { state.on[d.key] = !state.on[d.key]; delete state.roll[d.key]; save(); render(); });
    $('rows').appendChild(b);
  });

  function render() {
    var r = state.roll;
    DICE.forEach(function (d) {
      var die = $('die-' + d.key), face = die.firstChild, v = r[d.key];
      die.classList.toggle('off', !inPlay(d));
      face.classList.toggle('blank', !v);
      var on = v ? PIPS[v] : [];
      for (var i = 0; i < 9; i++) face.children[i].classList.toggle('on', on.indexOf(i) > -1);
      face.setAttribute('aria-label', d.name + (d.key === 'w1' ? ' 1' : d.key === 'w2' ? ' 2' : '') + ': ' +
        (!inPlay(d) ? 'out of play' : v ? v : 'not rolled'));
    });
    COLORS.forEach(function (d) {
      var b = $('row-' + d.key);
      b.setAttribute('aria-pressed', String(!!state.on[d.key]));
      b.lastChild.textContent = state.on[d.key] ? 'In play' : 'Out';
    });

    var rolled = r.w1 && r.w2, html = '';
    html += '<li><span class="dot white"></span><span class="lbl">White + white</span><span class="val">' +
      (rolled ? r.w1 + r.w2 : '–') + '</span></li>';
    COLORS.forEach(function (d) {
      var off = !state.on[d.key], c = r[d.key], val;
      if (off) val = 'Out';
      else if (rolled && c) {
        var a = r.w1 + c, b = r.w2 + c;
        val = a === b ? String(a) : Math.min(a, b) + '<small>or</small>' + Math.max(a, b);
      } else val = '–';
      html += '<li class="' + (off ? 'off' : '') + '"><span class="dot ' + d.cls + '"></span><span class="lbl">White + ' +
        d.name.toLowerCase() + '</span><span class="val">' + val + '</span></li>';
    });
    $('sums').innerHTML = html;
  }

  function roll() {
    DICE.forEach(function (d) { if (inPlay(d)) state.roll[d.key] = rand(); });
    save();
    var dice = $('dice');
    dice.classList.remove('rolling'); void dice.offsetWidth; dice.classList.add('rolling');
    if (navigator.vibrate) navigator.vibrate(30);
    render();
  }

  $('rollBtn').addEventListener('click', roll);
  document.addEventListener('keydown', function (e) {
    if (e.repeat || e.target.tagName === 'BUTTON' && e.key === ' ') return;
    if (e.key === 'r' || e.key === 'R' || e.key === ' ') { e.preventDefault(); roll(); }
  });
  render();
  keepAwake(true);
})();
</script>
</body>
</html>
