<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A63">
<title>Notifications | Pebbly</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
button,input{font:inherit;color:inherit}
[hidden]{display:none !important}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
h1{font:800 30px/1.15 var(--head);margin:0}
.lede{color:var(--muted);margin:6px 0 0}
h2{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card h3{font:600 17px/1.3 var(--head);margin:0;padding:14px 16px 4px}
.card .sub{display:block;font:400 14px/1.3 var(--body);color:var(--muted);margin-top:2px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 16px;border-top:1px solid var(--line);cursor:pointer}
.card h3 + .sw{border-top:0}
.sw input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:50px;height:30px;margin:0;border-radius:999px;background:var(--field);cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--brand)}
.sw input:checked::after{transform:translateX(20px)}
.sw input:disabled{opacity:.5}
details.card summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 16px;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);transition:transform .15s}
details.card[open] summary::after{transform:rotate(90deg)}
.ev{flex:1;min-width:0}
.ev b{display:block;font-weight:600;overflow-wrap:anywhere}
.ev small{color:var(--muted);font-size:14px}
.emo{font-size:22px;width:28px;text-align:center;flex:none}
.offn{font-size:13px;color:var(--muted);white-space:nowrap}
.hint{color:var(--muted);font-size:15px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.foot{margin-top:28px;text-align:center;font-size:15px}
.alerts{margin-top:20px;padding:16px}
.alerts h3{padding:0;margin:0 0 4px}
.alerts p{margin:0;color:var(--muted);font-size:15px}
.alerts .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 16px;border:0;border-radius:12px;
  background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:17px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.row .btn{flex:1 1 140px;width:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<script src="/nav.js"></script>
<script src="/notify.js"></script>
</head>
<body>
<main class="wrap">
  <div class="top"><h1>Notifications</h1><span data-pn-bell></span></div>
  <p class="lede">Choose what rings the 🔔 bell for events you host or have replied to, and whether this phone also gets alerts on its lock screen. What you’ve already seen is kept on each phone.</p>
  <section class="card alerts" id="alerts" hidden></section>
  <div id="app"><p class="hint" style="margin-top:20px">Loading…</p></div>
  <p class="foot"><a href="/">Back to Pebbly</a></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var N = window.PebblyNotify, $app = document.getElementById('app'), $toast = document.getElementById('toast'), toastTimer;
  var ROLE = { host: 'Events you host', guest: 'Events you replied to' };
  var feeds = [];   // [{ f, title, emoji, off }]

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m) { $toast.textContent = m; $toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 2600); }
  function typesFor(app, role) { return Object.keys(N.TYPES).filter(function (t) { return N.TYPES[t].app === app && N.TYPES[t].role === role; }); }
  function groupKey(x) { return x.f.app + ':' + x.f.role; }
  function sw(type, on, attrs) {
    return '<label class="sw"><span>' + esc(N.TYPES[type].label) + '</span><input type="checkbox" role="switch" ' + attrs + ' data-type="' + esc(type) + '"' + (on ? ' checked' : '') + '></label>';
  }

  function render() {
    if (!N.available()) {
      $app.innerHTML = '<div class="msg">Notifications aren’t switched on yet. Try again in a few minutes.</div>';
      return;
    }
    if (!feeds.length) {
      $app.innerHTML = '<div class="msg">Nothing to set up yet. When you host an event in <a href="/rsvp/">RSVP</a> or ' +
        '<a href="/whichdayworks/">Which Day Works?</a>, or reply to one, it shows up here.</div>';
      return;
    }
    var groups = [], offAll = N.offAll();
    feeds.forEach(function (x) { if (groups.indexOf(groupKey(x)) < 0) groups.push(groupKey(x)); });
    groups.sort(function (a, b) { return (a.split(':')[1] === 'host' ? 0 : 1) - (b.split(':')[1] === 'host' ? 0 : 1) || a.localeCompare(b); });
    $app.innerHTML = '<h2>All events</h2>' + groups.map(function (g) {
      var p = g.split(':'), off = offAll[g] || [];
      return '<section class="card"><h3>' + esc(N.APPS[p[0]].name) + '<span class="sub">' + ROLE[p[1]] + '</span></h3>' +
        typesFor(p[0], p[1]).map(function (t) { return sw(t, off.indexOf(t) < 0, 'data-group="' + esc(g) + '"'); }).join('') + '</section>';
    }).join('') +
    '<h2>Each event</h2><p class="hint" style="margin:-4px 0 10px">Turn things off for just one event.</p>' +
    feeds.map(function (x, i) {
      var types = typesFor(x.f.app, x.f.role), n = types.filter(function (t) { return x.off.indexOf(t) >= 0; }).length;
      return '<details class="card"><summary><span class="emo" aria-hidden="true">' + esc(x.emoji || '📌') + '</span>' +
        '<span class="ev"><b>' + esc(x.title || 'Event') + '</b><small>' + esc(N.APPS[x.f.app].name) + ' · ' + (x.f.role === 'host' ? 'You’re hosting' : 'You replied') + '</small></span>' +
        (n ? '<span class="offn">' + n + ' off</span>' : '') + '</summary>' +
        types.map(function (t) { return sw(t, x.off.indexOf(t) < 0, 'data-feed="' + i + '"'); }).join('') + '</details>';
    }).join('');
  }

  function save(changes, undo) {
    $app.querySelectorAll('input').forEach(function (el) { el.disabled = true; });
    return N.setOff(changes).then(function () {
      changes.forEach(function (c) { c.x.off = c.off; });
      toast('Saved.');
    }, function () {
      undo();
      toast('Couldn’t save. Check your connection and try again.');
    }).then(function () {
      var open = [].map.call($app.querySelectorAll('details'), function (d) { return d.open; });
      render();
      [].forEach.call($app.querySelectorAll('details'), function (d, i) { d.open = !!open[i]; });
    });
  }
  function toggle(list, type, on) { list = list.filter(function (t) { return t !== type; }); if (!on) list.push(type); return list; }

  $app.addEventListener('change', function (e) {
    var t = e.target, type = t.dataset.type;
    if (!type) return;
    if (t.dataset.group) {          // all events of one app and role, now and later
      var g = t.dataset.group, all = N.offAll(), before = (all[g] || []).slice();
      all[g] = toggle(before, type, t.checked); N.setOffAll(all);
      var changes = feeds.filter(function (x) { return groupKey(x) === g; }).map(function (x) { return { x: x, f: x.f, off: toggle(x.off, type, t.checked) }; });
      save(changes, function () { var a = N.offAll(); a[g] = before; N.setOffAll(a); });
    } else {
      var x = feeds[Number(t.dataset.feed)];
      save([{ x: x, f: x.f, off: toggle(x.off, type, t.checked) }], function () {});
    }
  });

  /* phone alerts */
  var $alerts = document.getElementById('alerts'), P = N.push, BUSY = false;
  var ALERT_ERR = {
    blocked: 'Notifications are blocked for Pebbly. To allow them: tap the icon left of the address bar, then Permissions (or Site settings), then Notifications.',
    dismissed: 'No problem. Tap the button again when you’re ready, and choose Allow.',
    not_ready: 'Phone alerts aren’t set up on the server yet. Try again later.',
    network: 'Couldn’t reach the server. Check your connection and try again.'
  };
  function alertsCard(state, note) {
    $alerts.hidden = false;
    var h = '<h3>📲 Phone alerts</h3>';
    if (state === 'no') h += '<p>This browser can’t show phone alerts. On Android, open Pebbly in Chrome.</p>';
    else if (state === 'ios-install') h += '<p>On iPhone, add Pebbly to your Home Screen first (Share, then Add to Home Screen), open it from there, and come back to this page.</p>';
    else if (state === 'blocked') h += '<p>' + ALERT_ERR.blocked + '</p>';
    else if (state === 'on') h += '<p>On for this phone: you’ll get an alert, even when Pebbly is closed. The switches below choose what for.</p>' +
      '<div class="row"><button type="button" class="btn ghost" data-alert="test">Send a test alert</button><button type="button" class="btn plain" data-alert="off">Turn off</button></div>';
    else h += '<p>Get an alert on your lock screen when something happens, even when Pebbly is closed.</p>' +
      '<div class="row"><button type="button" class="btn" data-alert="on">Turn on phone alerts</button></div>';
    if (note) h += '<p style="margin-top:10px;color:var(--ink)" role="status">' + note + '</p>';
    $alerts.innerHTML = h;
  }
  function showAlerts(note) { return P.state().then(function (s) { alertsCard(s, note); }); }
  $alerts.addEventListener('click', function (e) {
    var b = e.target.closest('[data-alert]');
    if (!b || BUSY) return;
    BUSY = true; b.disabled = true;
    var act = b.dataset.alert, p;
    if (act === 'on') p = P.on().then(function () { toast('Phone alerts are on.'); return showAlerts(); });
    else if (act === 'off') p = P.off().then(function () { toast('Phone alerts are off.'); return showAlerts(); });
    else p = P.test().then(function (ok) { toast(ok ? 'Sent. It should show up in a few seconds.' : 'Couldn’t send it. Try turning alerts off and on.'); b.disabled = false; });
    p.catch(function (er) {
      var m = er && er.message;
      return showAlerts(ALERT_ERR[m] || 'Something went wrong. Try again.');
    }).then(function () { BUSY = false; });
  });
  if (N.available()) showAlerts().then(function () { if (location.hash === '#alerts') $alerts.scrollIntoView({ block: 'center' }); });

  N.load().then(function (list) { feeds = list; render(); if (!N.available()) $alerts.hidden = true; }, function () {
    $app.innerHTML = '<div class="msg">Couldn’t load your settings. Check your connection and try again.</div>';
  });
})();
</script>
