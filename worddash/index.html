<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow">

<title>Word Dash</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED; --lead:#F2C230; --lead-t:#FBF0CC; --no:#CC423D; --no-t:#F6DAD8;
  --hit:#3E9B5C; --near:#D1A421; --miss:#7C8784; --key:#DCE3E0; --key-ink:#1F2A27; --key-off:#7C8784; --key-off-ink:#E9EEEC; --tile-line:#C9D2CE;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --lead:#E3B23C; --lead-t:#3A3218; --no:#F07A75; --no-t:#3D2221;
    --hit:#3E8E57; --near:#B38B1D; --miss:#3E4846; --key:#5E6C67; --key-ink:#FFFFFF; --key-off:#1A201E; --key-off-ink:#56625E; --tile-line:#3E4C46; color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --lead:#E3B23C; --lead-t:#3A3218; --no:#F07A75; --no-t:#3D2221;
    --hit:#3E8E57; --near:#B38B1D; --miss:#3E4846; --key:#5E6C67; --key-ink:#FFFFFF; --key-off:#1A201E; --key-off-ink:#56625E; --tile-line:#3E4C46; color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font:800 28px/1.15 var(--head);margin:8px 0 4px}
h2{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.lead{margin:0 0 16px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 14px;border:0;border-radius:12px;
  background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:17px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input[type=text]{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font:500 17px/1.2 var(--body)}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.x{color:var(--no)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.stack{display:grid;gap:10px}

/* ---------- Setup ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes.three{grid-template-columns:1fr 1fr 1fr}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:center;min-height:48px}
.mode input{position:absolute;opacity:0}
.mode b{font-size:16px}
.mode small{color:var(--muted);font-size:13px;line-height:1.3}
.mode:has(input:checked){border:2px solid var(--brand);background:var(--brand-t)}
.mode:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.opt{margin-top:14px}
.opt>span{display:block;font-weight:600;margin-bottom:8px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;gap:6px;align-items:center}
.plist .num{width:22px;flex:none;text-align:center}
.plist input{flex:1;min-width:0}
.plist .bot{flex:1;min-height:48px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--field);border-radius:10px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.addrow .btn{width:auto;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;overflow:hidden}
.chip .add{padding:0 6px 0 12px;min-height:36px;border:0;background:none;cursor:pointer;font-weight:500}
.chip .add::before{content:"+ ";color:var(--brand);font-weight:700}
.chip .forget{width:32px;min-height:36px;border:0;background:none;color:var(--muted);cursor:pointer}
.rules{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.rules li{margin:5px 0}

/* ---------- Play ---------- */
#play.wrap{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.topbar .title{flex:1;min-width:0}
.topbar h1{font-size:22px;margin:0}
.topbar .sub{color:var(--muted);font-size:13px}
.rivals{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 2px;scrollbar-width:none}
.rivals:empty{display:none}
.rival{flex:none;display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:600}
.rival.won{border-color:var(--hit);background:var(--brand-t)}
.rival.out{opacity:.55}
.mini{display:grid;grid-template-columns:repeat(5,5px);gap:1px}
.mini i{width:5px;height:5px;border-radius:1px;background:var(--line)}
.mini i.h{background:var(--hit)}.mini i.n{background:var(--near)}.mini i.m{background:var(--miss)}
.rival small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.status{min-height:22px;margin:0 0 6px;font-weight:600;text-align:center;font-size:15px}
.status.good{color:var(--brand)}.status.bad{color:var(--no)}

.grid{display:grid;gap:5px;justify-content:center;margin:0 auto 8px}
.grow{display:grid;grid-template-columns:repeat(5,var(--tile));gap:5px}
.tile{width:var(--tile);height:var(--tile);display:grid;place-items:center;border:2px solid var(--tile-line);border-radius:8px;
  font:800 calc(var(--tile) * .5)/1 var(--head);text-transform:uppercase;color:var(--ink);background:var(--surface)}
.tile.f{border-color:var(--muted)}
.tile.h,.tile.n,.tile.m{border-color:transparent;color:#fff}
.tile.h{background:var(--hit)}.tile.n{background:var(--near)}.tile.m{background:var(--miss)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.reveal{animation:flip .45s ease both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.grow.shake{animation:shake .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.tile.pop{animation:pop .1s}
@media (prefers-reduced-motion:reduce){.tile.reveal,.grow.shake,.tile.pop{animation:none}}

.kb{display:grid;gap:6px;user-select:none;-webkit-user-select:none;max-width:500px;margin:0 auto}
.kr{display:flex;gap:5px;justify-content:center}
.k{all:unset;box-sizing:border-box;flex:1 1 0;max-width:44px;height:var(--key-h,52px);display:grid;place-items:center;border-radius:7px;background:var(--key);
  font:700 16px/1 var(--body);text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--key-ink)}
.k.wide{flex:1.6 1 0;max-width:70px;font-size:13px}
.k:active{filter:brightness(.88)}
.k.h,.k.n{color:#fff}
.k.h{background:var(--hit)}.k.n{background:var(--near)}
.k.m{background:var(--key-off);color:var(--key-off-ink)}   /* not in the word: greyed out */
.k:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.after{display:grid;gap:8px;margin-top:8px}
.ps-badge{margin-bottom:6px}

/* dialogs */
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 40px);padding:0;border:0;border-radius:18px;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,16,.55)}
.dlg{padding:16px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dlghead h3{flex:1;margin:0;font:800 22px/1.2 var(--head)}
.word{font:800 34px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;text-align:center;margin:4px 0 14px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:12px}
.statrow b{display:block;font:800 26px/1 var(--head)}
.statrow span{font-size:12px;color:var(--muted)}
.dist{display:grid;gap:4px;margin-bottom:12px}
.dist div{display:flex;align-items:center;gap:6px;font-size:14px}
.dist i{display:block;min-width:22px;padding:2px 6px;border-radius:4px;background:var(--miss);color:#fff;font-style:normal;font-weight:700;text-align:right}
.dist i.me{background:var(--hit)}
.final{list-style:none;margin:0 0 12px;padding:0}
.final li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:16px}
.final .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final small{color:var(--muted)}
.final .tt{font:800 18px/1 var(--head)}
</style>
<script src="/keepawake.js"></script>
<script src="/play/sync.js"></script>
<script src="/nav.js"></script>
</head>
<body>

<!-- ================= Setup ================= -->
<main class="wrap" id="setup" hidden>
  <h1>Word Dash</h1>
  <p class="lead">Guess the hidden five-letter word in six tries. Race your friends on their phones, or practice on your own.</p>
  <div id="psJoin"></div>

  <section class="card">
    <h2>Play</h2>
    <div class="modes">
      <label class="mode"><input type="radio" name="mode" value="solo" checked><b>🙋 Just me</b><small>Practice: as many words as you like</small></label>
      <label class="mode"><input type="radio" name="mode" value="race"><b>🏁 Race</b><small>Everyone on their own phone, same word, no turns</small></label>
    </div>
    <div class="opt" id="nameOpt" hidden>
      <span>Your name</span>
      <input type="text" id="myName" maxlength="16" placeholder="Your name" autocomplete="off" enterkeyhint="done">
      <div class="chips" id="nameChips"></div>
      <p class="hint">You’ll get a code; others tap “Join a game with a code” on their phones. People can join any time.</p>
    </div>
  </section>

  <div id="psSetup" hidden></div>
  <div class="stack">
    <button class="btn" id="startBtn" type="button">Start</button>
    <button class="btn ghost" id="backBtn" type="button" hidden>Back to current game</button>
  </div>
</main>

<!-- ================= Play ================= -->
<main class="wrap" id="play" hidden>
  <div class="topbar">
    <div class="title"><h1>Word Dash</h1><div class="sub" id="sub"></div></div>
    <button class="icon-btn" id="statsBtn" type="button" aria-label="Stats" title="Stats">📊</button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" title="Menu">☰</button>
  </div>
  <div id="psBadge" hidden></div>
  <div class="rivals" id="rivals" aria-label="Other players"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="grid" id="grid" role="grid" aria-label="Your guesses"></div>
  <div class="after" id="after"></div>
  <div class="kb" id="kb" aria-label="Keyboard"></div>
</main>

<!-- ================= Menu ================= -->
<dialog id="menuDlg">
  <div class="dlg">
    <div class="dlghead"><h3>Menu</h3><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <div class="stack">
      <button class="btn plain" type="button" id="mGiveUp">Give up and show the word</button>
      <button class="btn plain" type="button" id="mSetup">Change mode</button>
    </div>
    <h2 style="margin-top:16px">How to play</h2>
    <ul class="rules" id="menuRules"></ul>
  </div>
</dialog>

<dialog id="endDlg">
  <div class="dlg">
    <div class="dlghead"><h3 id="endTitle"></h3><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <div class="word" id="endWord"></div>
    <div id="endBody"></div>
    <div class="stack"><button class="btn" type="button" id="endNext" autofocus>Next word</button></div>
  </div>
</dialog>

  var KEY = 'pebbly_worddash', K_STATS = 'pebbly_worddash_stats', K_MEM = 'pebbly_score_memory', ROWS = 6;
  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function tidy(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 8); }

  var validSet = null;
  function isValid(w) {
    if (!validSet) { validSet = new Set(); for (var i = 0; i < VALID.length; i += 5) validSet.add(VALID.substr(i, 5)); }
    return validSet.has(w);
  }

  // ================= State =================
  /* game = { mode:'solo'|'race', round, word (scrambled), players:[{id,name}],
              boards:{pid:{g:[guesses], at: when solved (ms) | null}}, results:{round: winner pid | ''} }
     Solo uses the same shape with one player ('me'). Who won and whether the round is over are worked
     out from the boards, so two phones finishing at once can't overwrite each other. */
  var game = load(KEY, null);
  var stats = load(K_STATS, { played: 0, won: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] });
  var mem = load(K_MEM, { players: [], games: [] }); if (!mem.players) mem.players = [];
  var sync = null, typed = '', revealRow = -1, roundSeen = null, endShown = null;
  function save() { store(KEY, game); if (sync && game.mode === 'race') sync.push(); }
  function hideWord(w, r) { return w.split('').map(function (c, i) { return String.fromCharCode(97 + ((c.charCodeAt(0) - 97 + 7 + i * 5 + r) % 26)); }).join(''); }
  function showWord(s, r) { return s.split('').map(function (c, i) { return String.fromCharCode(97 + (((c.charCodeAt(0) - 97 - 7 - i * 5 - r) % 26) + 26) % 26); }).join(''); }
  function word() { return showWord(game.word, game.round); }
  function myId() { return game.mode === 'race' ? PebblySync.me() : 'me'; }
  function board(pid) { return (game.boards && game.boards[pid]) || { g: [], at: null }; }
  function solvedBy(pid) { var b = board(pid); return b.g.length && b.g[b.g.length - 1] === word(); }
  function outOf(pid) { return !solvedBy(pid) && (board(pid).g.length >= ROWS || !!board(pid).out); }
  function winner() {
    var best = null;
    game.players.forEach(function (p) {
      if (!solvedBy(p.id)) return;
      var b = board(p.id);
      if (!best || b.at < board(best.id).at || (b.at === board(best.id).at && b.g.length < board(best.id).g.length)) best = p;
    });
    return best;
  }
  function roundOver() { return !!winner() || (game.players.length > 0 && game.players.every(function (p) { return outOf(p.id); })); }
  function pickWord(avoid) { var w; do { w = ANSWERS[rnd(ANSWERS.length)]; } while (w === avoid && ANSWERS.length > 1); return w; }

  // Clue colors for a guess: h = right letter, right spot; n = in the word, wrong spot; m = not in the word.
  function clue(guess, target) {
    var res = ['m', 'm', 'm', 'm', 'm'], left = {};
    for (var i = 0; i < 5; i++) { if (guess[i] === target[i]) res[i] = 'h'; else left[target[i]] = (left[target[i]] || 0) + 1; }
    for (i = 0; i < 5; i++) if (res[i] !== 'h' && left[guess[i]]) { res[i] = 'n'; left[guess[i]]--; }
    return res;
  }

  function mode() { return document.querySelector('input[name=mode]:checked').value; }
  function openSetup() {
    document.querySelector('input[name=mode][value=' + (game && game.mode === 'race' ? 'race' : 'solo') + ']').checked = true;
    if (!$('myName').value) $('myName').value = mem.players[0] || '';
    $('backBtn').hidden = !game;
    $('play').hidden = true; $('setup').hidden = false; keepAwake(false); scrollTo(0, 0);
    renderSetup();
  }
  function renderSetup() {
    var race = mode() === 'race';
    $('nameOpt').hidden = !race;
    if (sync && sync.box) sync.box.set(race);
    var have = tidy($('myName').value).toLowerCase();
    $('nameChips').innerHTML = mem.players.filter(function (n) { return n.toLowerCase() !== have; }).slice(0, 8).map(function (n) {
      return '<span class="chip"><button type="button" class="add" data-name="' + esc(n) + '">' + esc(n) + '</button></span>';
    }).join('');

    $('startBtn').textContent = race ? (tidy($('myName').value) ? 'Start a race' : 'Type your name') : 'Start';
  }
  document.querySelectorAll('input[name=mode]').forEach(function (r) { r.addEventListener('change', renderSetup); });

  });

  // ================= Rounds =================
  function newRound(base) {
    var w = pickWord(game && game.word ? word() : null);
    game = { mode: base.mode, round: base.round, word: hideWord(w, base.round), players: base.players, boards: {}, results: base.results || {} };
    game.players.forEach(function (p) { game.boards[p.id] = { g: [], at: null }; });
    typed = ''; revealRow = -1; save(); showPlay();
  }
  function nextRound() {
    if (game.mode === 'race' && !roundOver() && !confirm('Skip to a new word for everyone? Nobody wins this one.')) return;
    if ($('endDlg').open) $('endDlg').close();
    var results = Object.assign({}, game.results), w = winner();
    if (game.mode === 'race') results[game.round] = w ? w.id : '';
    newRound({ mode: game.mode, round: game.round + 1, players: game.players, results: results });
  }
  function tally(pid) { var n = 0; for (var r in game.results) if (game.results[r] === pid) n++; var w = winner(); if (roundOver() && w && w.id === pid && !(game.round in game.results)) n++; return n; }

  // ================= Guessing =================
  function canType() { var me = myId(); return !!me && !!game.boards[me] && !roundOver() && !solvedBy(me) && !outOf(me); }
  function addLetter(ch) { if (!canType() || typed.length >= 5) return; typed += ch; render(); var t = document.querySelector('.grow.cur .tile:nth-child(' + typed.length + ')'); if (t) t.classList.add('pop'); }
  function backspace() { if (!canType() || !typed) return; typed = typed.slice(0, -1); render(); }
  function submit() {
    if (!canType()) return;
    if (typed.length < 5) { shake('Not enough letters'); return; }
    if (!isValid(typed)) { shake('Not in the word list'); return; }
    var me = myId(), b = game.boards[me];
    b.g.push(typed);
    if (typed === word()) { b.at = Date.now(); }
    revealRow = b.g.length - 1; typed = '';
    if (game.mode === 'solo' && (solvedBy(me) || outOf(me))) recordSolo(solvedBy(me), b.g.length);
    if (solvedBy(me)) buzz([40, 60, 120]); save(); render();
    if (roundOver() || (game.mode === 'solo' && (solvedBy(me) || outOf(me)))) setTimeout(showEnd, 1700);
    else if (outOf(me)) msg('Out of guesses. Watch the others…', 'bad');
  }
  function shake(text) {
    var row = document.querySelector('.grow.cur'); if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }
    buzz([30, 40, 30]); msg(text, 'bad');
    clearTimeout(shake.t); shake.t = setTimeout(function () { render(); }, 1400);
  }
  function recordSolo(won, n) {
    stats.played++;
    if (won) { stats.won++; stats.streak++; stats.best = Math.max(stats.best, stats.streak); stats.dist[n - 1]++; } else stats.streak = 0;
    store(K_STATS, stats);
  }

  // ================= Render =================
  function msg(text, cls) { var s = $('status'); s.textContent = text || ''; s.className = 'status' + (cls ? ' ' + cls : ''); }
  function showPlay() {
    $('setup').hidden = true; $('play').hidden = false; keepAwake(true); render();
    if (roundOver() || (game.mode === 'solo' && (solvedBy('me') || outOf('me')))) setTimeout(showEnd, 300);
  }
  function size() {
    // Fit the six rows and the keyboard on the screen without scrolling.
    var top = $('grid').getBoundingClientRect().top + scrollY, kb = 3 * 52 + 2 * 6, after = $('after').offsetHeight;
    var avail = innerHeight - top - kb - after - 24;
    var tile = Math.max(34, Math.min(60, Math.floor((avail - 5 * 5) / 6), Math.floor(($('play').clientWidth - 32 - 20) / 5)));
    document.documentElement.style.setProperty('--tile', tile + 'px');
  }
  function render() {
    if (!game) return;
    var me = myId(), b = board(me), w = word(), over = roundOver(), win = winner(), mine = game.boards[me];
    $('sub').textContent = game.mode === 'race' ? 'Race · word ' + game.round : 'Practice';
    $('statsBtn').hidden = game.mode !== 'solo';
    // rivals
    var rv = '';
    if (game.mode === 'race') game.players.forEach(function (p) {
      if (p.id === me) return;
      var pb = board(p.id), cells = '';
      for (var r = 0; r < ROWS; r++) { var cl = pb.g[r] ? clue(pb.g[r], w) : null; for (var c = 0; c < 5; c++) cells += '<i' + (cl ? ' class="' + cl[c] + '"' : '') + '></i>'; }
      var st = solvedBy(p.id) ? '✓ got it in ' + pb.g.length : outOf(p.id) ? '✗ out' : pb.g.length + ' of ' + ROWS;
      rv += '<div class="rival' + (solvedBy(p.id) ? ' won' : outOf(p.id) ? ' out' : '') + '"><span class="mini" aria-hidden="true">' + cells + '</span><span>' + esc(p.name) +
        ' <b>' + tally(p.id) + '</b><small>' + st + '</small></span></div>';
    });
    $('rivals').innerHTML = rv;
    // status
    if (!$('status').classList.contains('bad') || !document.querySelector('.grow.shake')) {
      if (!mine) msg('Watching this word. You’ll join in on the next one.');
      else if (over && win) msg(win.id === me ? '🎉 You got it first!' : '🏁 ' + win.name + ' got it! The word was ' + w.toUpperCase() + '.', win.id === me ? 'good' : '');
      else if (over) msg('Nobody got it. The word was ' + w.toUpperCase() + '.');
      else if (solvedBy(me)) msg(game.mode === 'race' ? '✓ Got it! Waiting to see who was first…' : '🎉 Got it!', 'good');
      else if (outOf(me)) msg(game.mode === 'race' ? 'Out of guesses. Watch the others…' : 'The word was ' + w.toUpperCase() + '.', 'bad');
      else msg(game.mode === 'race' ? (game.players.length < 2 ? 'Share the code so others can join. Go!' : 'Go! First to find the word wins.') : '');
    }
    // grid
    var h = '';
    for (var r = 0; r < ROWS; r++) {
      var g = b.g[r], cur = !g && r === b.g.length && canType();
      h += '<div class="grow' + (cur ? ' cur' : '') + '" role="row">';
      var cl = g ? clue(g, w) : null, letters = g || (cur ? typed : '');
      for (var c = 0; c < 5; c++) {
        var ch = letters[c] || '', cls = 'tile' + (cl ? ' ' + cl[c] : ch ? ' f' : '') + (r === revealRow ? ' reveal' : '');
        h += '<span class="' + cls + '" role="gridcell"' + (r === revealRow ? ' style="animation-delay:' + c * 150 + 'ms;transition-delay:' + c * 150 + 'ms"' : '') +
          ' aria-label="' + (ch ? ch.toUpperCase() + (cl ? (cl[c] === 'h' ? ', right spot' : cl[c] === 'n' ? ', wrong spot' : ', not in the word') : '') : 'empty') + '">' + ch + '</span>';
      }
      h += '</div>';
    }
    $('grid').innerHTML = h; revealRow = -1;
    // after-round buttons
    var done = over || (game.mode === 'solo' && (solvedBy(me) || outOf(me)));
    $('after').innerHTML = done ? '<button class="btn" type="button" data-a="next">Next word</button>' : '';
    // keyboard
    var best = {};
    b.g.forEach(function (g) { var cl = clue(g, w); for (var i = 0; i < 5; i++) { var k = g[i], v = cl[i]; if (v === 'h' || (v === 'n' && best[k] !== 'h') || (!best[k])) best[k] = v; } });
    var rows = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'], kh = '';
    rows.forEach(function (row) {
      kh += '<div class="kr">';
      row.split('').forEach(function (k) {
        if (k === '+') kh += '<button type="button" class="k wide" data-k="enter">Enter</button>';
        else if (k === '-') kh += '<button type="button" class="k wide" data-k="back" aria-label="Delete">⌫</button>';
        else kh += '<button type="button" class="k' + (best[k] ? ' ' + best[k] : '') + '" data-k="' + k + '">' + k + '</button>';
      });
      kh += '</div>';
    });
    $('kb').innerHTML = kh;
    $('kb').hidden = !mine || done;
    size();
    if (game.round !== roundSeen) { roundSeen = game.round; endShown = null; }
  }

  // ================= End of a word =================
  function showEnd() {
    var me = myId(), key = game.round;
    if (endShown === key || $('endDlg').open || $('play').hidden) return;
    var solo = game.mode === 'solo';
    if (!solo && !roundOver()) return;
    endShown = key;
    var w = winner(), body = '';
    $('endWord').textContent = word();
    if (solo) {
      $('endTitle').textContent = solvedBy(me) ? ['🤯 Genius!', '🔥 Brilliant!', '🎉 Great!', '👏 Nice!', '😅 Phew!', '😮‍💨 Just made it!'][board(me).g.length - 1] : '🙈 Not this time';
      body = statsHTML(solvedBy(me) ? board(me).g.length : 0);
    } else {
      $('endTitle').textContent = !w ? 'Nobody got it' : w.id === me ? '🏆 You won!' : '🏁 ' + w.name + ' won!';
      var rows = game.players.map(function (p) { return { p: p, t: tally(p.id), b: board(p.id) }; }).sort(function (a, c) { return c.t - a.t; });
      body = '<ol class="final">' + rows.map(function (r) {
        var st = solvedBy(r.p.id) ? 'got it in ' + r.b.g.length : outOf(r.p.id) ? 'out of guesses' : r.b.g.length ? r.b.g.length + ' guesses' : 'no guesses';
        return '<li><span class="nm">' + esc(r.p.name) + (r.p.id === me ? ' (you)' : '') + ' <small>' + st + '</small></span><span class="tt">' + r.t + ' <small>' + (r.t === 1 ? 'win' : 'wins') + '</small></span></li>';
      }).join('') + '</ol>';
    }
    $('endBody').innerHTML = body;
    $('endDlg').showModal();
  }
  function statsHTML(hl) {
    var pct = stats.played ? Math.round(stats.won / stats.played * 100) : 0, mx = Math.max.apply(null, stats.dist.concat(1));
    return '<div class="statrow"><div><b>' + stats.played + '</b><span>played</span></div><div><b>' + pct + '%</b><span>won</span></div>' +
      '<div><b>' + stats.streak + '</b><span>streak</span></div><div><b>' + stats.best + '</b><span>best streak</span></div></div>' +
      '<h2>Guesses needed</h2><div class="dist">' + stats.dist.map(function (n, i) {
        return '<div><span>' + (i + 1) + '</span><i class="' + (hl === i + 1 ? 'me' : '') + '" style="width:' + Math.max(8, n / mx * 85) + '%">' + n + '</i></div>';
      }).join('') + '</div>';
  }

  // ================= Events =================
  $('kb').addEventListener('click', function (e) {
    var k = e.target.closest('[data-k]'); if (!k) return;
    if (k.dataset.k === 'enter') submit(); else if (k.dataset.k === 'back') backspace(); else addLetter(k.dataset.k);
  });
  document.addEventListener('keydown', function (e) {
    if ($('play').hidden || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (/^[a-zA-Z]$/.test(e.key)) addLetter(e.key.toLowerCase());
  });
  $('after').addEventListener('click', function (e) { if (e.target.closest('[data-a=next]')) nextRound(); });
  $('endNext').addEventListener('click', nextRound);
  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });
  $('statsBtn').addEventListener('click', function () {
    $('endTitle').textContent = '📊 Your stats'; $('endWord').textContent = ''; $('endBody').innerHTML = statsHTML(0);
    $('endNext').hidden = true; $('endDlg').showModal();
  });
  $('endDlg').addEventListener('close', function () { $('endNext').hidden = false; });
  $('menuBtn').addEventListener('click', function () {
    var me = myId();
    $('mGiveUp').hidden = !canType() || !game.boards[me];
    $('mGiveUp').textContent = game.mode === 'race' ? 'Give up this word' : 'Give up and show the word';
    $('menuRules').innerHTML = [
      'Guess the hidden five-letter word. Each guess must be a real word.',
      'After each guess the tiles change color: <b style="color:var(--hit)">green</b> = right letter in the right spot, <b style="color:var(--near)">yellow</b> = in the word but in a different spot, gray = not in the word.',
      'You get six guesses.',
      game.mode === 'race' ? 'Race: everyone has the same word and guesses at the same time; no turns. First to find it wins. Run out of guesses and you’re out for that word. The small grids at the top show how the others are doing (colors only, never their letters).'
        : 'Practice: as many words as you like. Your stats and streak are kept on this phone.'
    ].map(function (r) { return '<li>' + r + '</li>'; }).join('');
    $('menuDlg').showModal();
  });
  $('mGiveUp').addEventListener('click', function () {
    $('menuDlg').close();
    if (!confirm(game.mode === 'race' ? 'Give up this word? You’ll be out until the next one.' : 'Give up and see the word? It counts as a loss.')) return;
    var b = game.boards[myId()];
    b.out = true;
    if (game.mode === 'solo') recordSolo(false, ROWS);
    save(); render();
    if (roundOver() || game.mode === 'solo') setTimeout(showEnd, 300);
  });
  $('mSetup').addEventListener('click', function () { $('menuDlg').close(); openSetup(); });
  addEventListener('resize', function () { if (game && !$('play').hidden) size(); });

  if (game && game.word) showPlay(); else { game = null; openSetup(); }

  // Play together (see /play/sync.js): only the race uses it.
  sync = PebblySync.wire('worddash', {
    setupEl: $('psSetup'), joinEl: $('psJoin'), badgeEl: $('psBadge'),
    names: function () { return null; },
    getGame: function () { return game; },
    setGame: function (g) { game = g; store(KEY, game); },
    clearUndo: function () {},
    render: function () { if (game && !$('play').hidden) { render(); if (roundOver()) setTimeout(showEnd, 1200); } },
    showPlay: showPlay,
    players: function (g) { return g.players || []; },
    addPlayer: function (g, id, name) { g.players.push({ id: id, name: name }); g.boards[id] = { g: [], at: null }; },
    onLeave: openSetup,
    onRemote: function (prev, next) {
      if (!prev || !next) return;
      if (next.round !== prev.round) { typed = ''; if ($('endDlg').open) $('endDlg').close(); buzz(20); }
    }
  });
  if (!$('setup').hidden) renderSetup();

  // Exposed for automated checks only.
  window.__wd = { clue: clue, isValid: isValid, word: function () { return word(); }, game: function () { return game; }, ANSWERS: ANSWERS };
})();
</script>
