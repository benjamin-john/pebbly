<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A63">
<meta name="description" content="Swipe through baby names together and see the ones you both love.">
<title>Baby Names</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED;
  --good:#23704A; --good-t:#DCEFE3; --bad:#B8362F; --bad-t:#F8E1DF; --warn-t:#FBF0CC; --warn-line:#E5CB6B;
  --girl:#A8345F; --girl-t:#FBE4EE; --boy:#2A64A0; --boy-t:#E1EDF8; --star:#E0A100;
  --shadow:0 8px 24px rgba(20,42,34,.22); --lift:0 10px 30px rgba(20,42,34,.14);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31;
    --good:#6CC48F; --good-t:#1C3326; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --girl:#F29CC2; --girl-t:#3A2230; --boy:#8DBDF0; --boy-t:#1E2C3D; --star:#F2C14E;
    --shadow:0 8px 24px rgba(0,0,0,.5); --lift:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31;
    --good:#6CC48F; --good-t:#1C3326; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --girl:#F29CC2; --girl-t:#3A2230; --boy:#8DBDF0; --boy-t:#1E2C3D; --star:#F2C14E;
    --shadow:0 8px 24px rgba(0,0,0,.5); --lift:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
[hidden]{display:none !important}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:20px;font-weight:800}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{color:var(--muted);font-size:14px}
.lede{margin:8px 0 18px;font-size:17px;color:var(--muted);max-width:46ch}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.4em}
.err:empty{min-height:0;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.link{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--brand);font-weight:600;cursor:pointer;font-size:15px}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.icon-btn:disabled{opacity:.3;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card>h2{margin-bottom:10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cardhead h2{margin:0}
.fld{display:block;margin-bottom:16px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.fld small{display:block;color:var(--muted);margin-top:5px;font-size:13px}
input[type=text],input[type=search],select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:17px}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-size:17px;resize:vertical}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg label{position:relative;display:flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:0 4px;font-size:15px}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg input:focus-visible + span{outline:3px solid var(--brand)}
.opts{display:grid;gap:8px}
.opt{position:relative;display:flex}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600}
.opt span small{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.opt input:checked + span{border:2px solid var(--brand);background:var(--brand-t);padding:5px 13px}
.opt input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}

/* ---------- top of a page ---------- */
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;min-height:44px}
.topnav a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.saving::before{background:#D9A520}
.sync.offline{color:var(--bad)}
.sync.offline::before{background:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.banner{background:var(--warn-t);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.created{background:var(--brand-t);border-color:var(--brand)}
.created .cardhead{margin-bottom:4px}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;min-width:0;font-size:15px}
.recent{margin-top:26px}
.recent h2{margin-bottom:8px}
.recent ul{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recent li+li{border-top:1px solid var(--line)}
.recent a{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;color:var(--ink);text-decoration:none}
.recent a .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;background:var(--brand-t);color:var(--brand);border-radius:999px;padding:2px 8px;white-space:nowrap}
.state{text-align:center;padding:40px 8px}
.state .e{font-size:48px;line-height:1;margin-bottom:10px}
.state .lede{margin:8px auto 18px}

.apphead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.apphead h1{flex:1;min-width:0;font-size:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{min-height:46px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--muted);cursor:pointer;font-size:16px}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink)}
.tabs .n{font-weight:600;opacity:.85}
.mebar{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:14px;margin:-4px 0 6px}
.mebar b{color:var(--ink)}

/* ---------- swiping ---------- */
.filterbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border:1px dashed var(--field);border-radius:12px;background:none;cursor:pointer;
  font-size:15px;color:var(--ink);text-align:left}
.filterbtn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filterbtn b{font-weight:700}
.stack{position:relative;height:360px;margin:12px 0 14px}
.ncard{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:28px 20px 22px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;overflow:hidden}
.ncard.back{transform:translateY(12px) scale(.94);opacity:.6;pointer-events:none;box-shadow:none}
.ncard.back > *{visibility:hidden}
.ncard .big{font:800 54px/1.02 var(--head);letter-spacing:-.01em;overflow-wrap:anywhere;max-width:100%}
.ncard .big.long{font-size:40px}
.ncard .alts{color:var(--muted);font-size:16px;max-width:30ch}
.ncard .alts b{color:var(--ink);font-weight:600}
.ncard .src{font-size:13px;color:var(--muted)}
.stamp{position:absolute;top:22px;padding:2px 12px;border:3px solid;border-radius:10px;font:800 26px/1.2 var(--head);pointer-events:none;letter-spacing:.04em}
.stamp.like{left:18px;color:var(--good);opacity:var(--like,0);transform:rotate(-12deg)}
.stamp.nope{right:18px;color:var(--bad);opacity:var(--nope,0);transform:rotate(12deg)}
.g{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--brand-t);color:var(--brand)}
.g.g-g{background:var(--girl-t);color:var(--girl)}
.g.g-b{background:var(--boy-t);color:var(--boy)}
.pop{width:min(260px,100%)}
.pop .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px;gap:8px}
.pop .row b{color:var(--ink)}
.pop .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pop .bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.acts{display:flex;justify-content:center;align-items:center;gap:22px}
.round{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;font-size:32px;border:2px solid var(--line);background:var(--surface);
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.round:active{transform:scale(.94)}
.round.no{color:var(--bad);border-color:var(--bad)}
.round.yes{color:var(--good);border-color:var(--good)}
.round.undo{width:54px;height:54px;font-size:22px;color:var(--muted)}
.round:disabled{opacity:.35;cursor:default;transform:none}
.seen{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;
  border:2px dashed var(--line);border-radius:22px}
.done .e{font-size:44px;line-height:1}
.done .tools{justify-content:center}

.stars{display:flex;gap:4px;justify-content:center}
.star{width:52px;height:56px;font-size:38px;line-height:1;border:0;background:none;color:var(--line);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.star.on{color:var(--star)}
.star:active{transform:scale(.9)}
.stars.sm .star{width:44px;height:44px;font-size:30px}
.nobtn{min-height:44px}
.nobtn[aria-pressed=true]{border:2px solid var(--bad);background:var(--bad-t);color:var(--bad)}
.ratehead{text-align:center;margin-bottom:6px}
.ratehead .big{font:800 34px/1.1 var(--head);overflow-wrap:anywhere}
.s5{color:var(--star);letter-spacing:1px;white-space:nowrap}
.s5 i{font-style:normal;color:var(--line)}

/* ---------- our list ---------- */
.sec{margin:0 0 18px}
.sec>h2{font-size:13px;font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px 4px;
  display:flex;justify-content:space-between;gap:8px}
.sec>h2 span{font-weight:600;letter-spacing:0}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rows>li+li{border-top:1px solid var(--line)}
.nrow{display:flex;align-items:flex-start;gap:4px;padding:6px 6px 6px 0}
.nrow .pos{flex:none;width:36px;text-align:center;font:800 18px/44px var(--head);color:var(--brand)}
.nrow .main{flex:1;min-width:0;padding:4px 0}
.nrow .open{display:block;width:100%;border:0;background:none;text-align:left;padding:4px 4px 2px 0;cursor:pointer;min-height:44px}
.nrow .open b{font:800 22px/1.2 var(--head);margin-right:6px;overflow-wrap:anywhere}
.nrow .open small{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.nrow .rates{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--muted);margin-top:2px}
.nrow .rates b{color:var(--ink);font-weight:600}
.nrow .mv{flex:none;display:flex;flex-direction:column;gap:4px}
.nrow .mv .icon-btn{border:0;background:var(--bg)}
.nrow.lone .pos{width:12px}
.notes{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.notes li{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:15px;overflow-wrap:anywhere}
.notes li b{font-weight:700;margin-right:4px}
.notes li .x{float:right;border:0;background:none;color:var(--muted);cursor:pointer;min-width:32px;min-height:28px;padding:0;margin:-4px -6px 0 4px;font-size:15px}
.addnote{display:inline-flex;align-items:center;min-height:40px;border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .e{font-size:40px;line-height:1;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note{background:var(--brand-t);border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 18px}
.chiplist{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.nchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-weight:600;font-size:15px}
.nchip small{color:var(--star);font-weight:700}
.nchip.x small{color:var(--bad)}
details.more{margin:0 0 18px}
details.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:0 4px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";font-size:16px}
details.more[open]>summary::after{content:"▴"}
.find{margin-top:4px}
.find .res{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.find .res:empty{display:none}
.find .res li+li{border-top:1px solid var(--line)}
.find .res button{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:6px 14px;border:0;background:none;text-align:left;cursor:pointer}
.find .res button b{font-weight:700}
.find .res button small{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find .res .v{font-size:14px;white-space:nowrap}

/* ---------- dialogs ---------- */
dialog.dlg{width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);padding:0;border:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(10,20,16,.55)}
.dlg>form,.dlg>.in{padding:16px}
.dlghead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dlghead h2{flex:1;margin:0;font-size:22px;overflow-wrap:anywhere}
.dlghead .icon-btn{border:0;background:var(--bg)}
.dlgbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dlgbtns .btn{flex:1 1 auto}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;width:100%;padding:10px 16px;text-align:left}
.menu .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.menu h3{font-size:13px;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 0 4px}
.dsec{margin-top:16px}
.dsec>h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:8px}
.dinfo{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.myrate{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.preview .t{font-weight:700}
.preview .alts{color:var(--muted);font-size:14px}
.prompt{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;overflow-wrap:anywhere;max-height:240px;overflow:auto}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--brand);font-weight:600}
.step{font:800 15px var(--head);color:var(--brand);margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;margin-bottom:12px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.result{background:var(--good-t);border-radius:12px;padding:12px 14px;margin-top:12px}

#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;font-size:15px;font-weight:500;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.match{background:var(--good);color:#fff;font-weight:700;font-size:17px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:359px){ h1{font-size:26px} .ncard .big{font-size:44px} .stack{height:330px} .star{width:46px} .acts{gap:16px} }
</style>
<script src="/lock.js"></script>
<script src="/doc.js"></script>
<script src="/nav.js"></script>
</head>
<body>
<main id="app" class="wrap"><p class="hint">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">This page needs JavaScript to work.</p></noscript>

<!-- Built-in names: US Social Security baby name data (names in the top 1,000 for a recent year, 2015–2024,
     plus classics that were in the top 150 any year since 1900). Name|gender (g girl, b boy, u either)|popularity
     (0–100 from the 2022–2024 rank: 100 − 25 × log10(rank), so 75 ≈ top 10, 50 ≈ top 100, 25 ≈ top 1,000)|
     nicknames and full forms (from the nicknames-curated package, same gender, common names only). -->
<script type="text/plain" id="catalog">

    '<label class="fld"><span>Type of name or vibe</span><input type="text" id="aiVibe" maxlength="120" placeholder="e.g. Irish, nature, vintage, short and strong"></label>' +
    '<label class="fld"><span>How many</span><select id="aiN"><option>25</option><option selected>50</option><option>100</option></select></label>' +
    (mine.length ? '<label class="chk"><input type="checkbox" id="aiEx" checked><span>Mention names we like (' + esc(mine.slice(0, 4).join(', ')) + (mine.length > 4 ? '…' : '') + ') so it gets our taste</span></label>' : '') +
    '<button type="button" class="btn primary wide" id="aiCopy">📋 Copy the request</button>' +
    '<p class="hint" style="margin-top:8px">Paste it into your AI app. It answers with a box of names and a copy button: tap that, then come back here.</p>' +
    '<details><summary>Show the request</summary><pre class="prompt" id="aiPrompt"></pre></details>' +
    '<p class="step" style="margin-top:14px">2 · Paste the AI’s reply</p>' +
    '<textarea id="aiText" rows="5" placeholder=\'{"names": [ … ]}\' spellcheck="false"></textarea>' +
    '<div class="dlgbtns"><button type="button" class="btn small" id="aiPaste">Paste</button><button type="button" class="btn primary" id="aiImport">Add these names</button></div>' +
    '<p class="err" id="aiErr" role="alert"></p><div id="aiDone"></div></div>');
  function g() { return d.querySelector('[name=aiG]:checked').value; }
  function prompt() { return aiPrompt(g(), tidy($('#aiVibe', d).value), $('#aiN', d).value, $('#aiEx', d) && $('#aiEx', d).checked ? mine : []); }
  function show() { $('#aiPrompt', d).textContent = prompt(); }
  show();
  d.addEventListener('input', show); d.addEventListener('change', show);
  $('#aiCopy', d).addEventListener('click', function () {
    copyText(prompt()).then(function (ok) { toast(ok ? 'Copied. Paste it into your AI app, then copy its reply back here.' : 'Couldn’t copy. Open “Show the request” and copy it by hand.'); });
  });
  $('#aiPaste', d).addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { $('#aiText', d).focus(); return; }
    navigator.clipboard.readText().then(function (t) { $('#aiText', d).value = t; }, function () { $('#aiText', d).focus(); toast('Long-press the box and choose Paste.'); });
  });
  $('#aiImport', d).addEventListener('click', function () {
    var err = $('#aiErr', d), rows = parseImport($('#aiText', d).value);
    err.textContent = '';
    if (!rows.length) { err.textContent = 'Couldn’t find any names in that. Copy the AI’s whole reply (or just the box with the names) and paste it again.'; return; }
    var gg = g(), vibe = tidy($('#aiVibe', d).value).slice(0, 40);
    var label = (vibe ? cap(vibe) : 'AI ideas') + (gg === 'g' ? ' (girls)' : gg === 'b' ? ' (boys)' : '');
    var r = importNames(rows, label, gg);
    if (!r) return;
    $('#aiDone', d).innerHTML = '<div class="result"><b>Added ' + plural(r.total, 'name') + ' as “' + esc(label) + '”.</b><br>' +
      r.added + ' new' + (r.merged ? ', ' + r.merged + ' already here (matched by name or nickname, so they keep their popularity and nicknames)' : '') + '.' +
      '<div class="dlgbtns" style="margin-top:10px"><button type="button" class="btn primary small" data-x="only">Swipe just these</button>' +
      '<button type="button" class="btn small" data-x="all">Swipe all names</button></div></div>';
    $('#aiText', d).value = '';
    $('#aiDone', d).addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-x]'); if (!b) return;
      setPref('src', b.getAttribute('data-x') === 'only' ? r.id : 'all'); setPref('view', 'swipe');
      if (b.getAttribute('data-x') === 'only' && gg !== S.gender && S.gender !== 'any') change(function (s) { s.gender = gg; });
      d.close(); shownKey = null; render({ force: true });
    });
  });
}

/* ---------- menu, people */
function openMenu() {
  var lists = Object.keys(S.lists);
  var d = dialog('<div class="in">' + head('Options') + '<div class="menu">' +
    '<button type="button" class="btn" data-m="suggest"><span>＋ Add a name<small>One you’ve been thinking of. It goes to the top of ' + esc(who(other())) + '’s pile.</small></span></button>' +
    '<button type="button" class="btn" data-m="ai"><span>✨ Ideas from AI<small>Names in a style you pick, from ChatGPT, Gemini or Claude</small></span></button>' +
    '<button type="button" class="btn" data-m="filters"><span>⚙️ What to swipe<small>Girls or boys, which names, how popular</small></span></button>' +
    '<button type="button" class="btn" data-m="share"><span>🔗 Share link<small>For ' + esc(who(other())) + ' or a second phone</small></span></button>' +
    '<button type="button" class="btn" data-m="people"><span>🙋 Your names<small>' + esc(who('a')) + ' and ' + esc(who('b')) + '</small></span></button>' +
    '<button type="button" class="btn" data-m="switch"><span>🔄 Swipe as ' + esc(who(other())) + '<small>If you’re sharing this phone</small></span></button>' +
    (lists.length ? '<button type="button" class="btn" data-m="lists"><span>🗂️ AI lists<small>' + plural(lists.length, 'list') + '. Rename or remove.</small></span></button>' : '') +
    (D && D.isOwner ? '<h3>Host</h3>' +
      '<button type="button" class="btn" data-m="copy-host"><span>Copy host link<small>Manage this from another phone. Keep it private.</small></span></button>' +
      '<button type="button" class="btn" data-m="lock"><span>🔒 Password</span></button>' +
      '<button type="button" class="btn" data-m="delete" style="color:var(--bad)"><span>Delete this shortlist<small>For both of you. Can’t be undone.</small></span></button>' : '') +
    '</div><div class="dlgbtns" style="margin-top:14px"><button type="button" class="btn" data-close>Close</button></div></div>');
  d.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-m]'); if (!b) return;
    var m = b.getAttribute('data-m');
    d.close();
    if (m === 'suggest') openSuggest();
    else if (m === 'ai') openAI();
    else if (m === 'filters') openFilters();
    else if (m === 'share') share(title(), shareUrl(CODE));
    else if (m === 'people') openPeople();
    else if (m === 'switch') { setPref('me', other()); undoStack = []; shownKey = null; render({ force: true }); toast('Now swiping as ' + who(me()) + '.'); }
    else if (m === 'lists') openLists();
    else if (m === 'copy-host') copyText(PebblyDoc.ownerLink(CODE)).then(function (ok) { toast(ok ? 'Host link copied. Keep it private.' : 'Couldn’t copy. Try again.'); });
    else if (m === 'lock') PebblyLock.openHost({ app: 'doc', code: CODE, owner: PebblyDoc.owner(CODE), raw: PebblyDoc.raw, what: 'list', toast: toast });
    else if (m === 'delete') {
      if (!confirm('Delete “' + title() + '” for both of you? All your swipes, ratings and comments go too. This can’t be undone.')) return;
      D.remove().then(function () { forgetList(CODE); D = null; history.pushState(null, '', baseUrl()); route(); toast('Deleted.'); }, function (e) { toast(friendly(e)); });
    }
  });
}
function openPeople() {
  var d = dialog('<form novalidate autocomplete="off">' + head('Your names') +
    '<label class="fld"><span>Parent 1</span><input type="text" name="a" maxlength="30" value="' + esc(S.p.a) + '"></label>' +
    '<label class="fld"><span>Parent 2</span><input type="text" name="b" maxlength="30" value="' + esc(S.p.b) + '"></label>' +
    '<p class="err" role="alert"></p><div class="dlgbtns"><button type="submit" class="btn primary">Save</button><button type="button" class="btn" data-close>Cancel</button></div></form>');
  var f = d.querySelector('form');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var a = tidy(f.a.value).slice(0, 30), b = tidy(f.b.value).slice(0, 30);
    if (!a) { d.querySelector('.err').textContent = 'Parent 1 needs a name.'; return; }
    if (change(function (s) { s.p.a = a; s.p.b = b; })) { d.close(); toast('Saved.'); }
  });
}
function openLists() {
  var d = dialog('<div class="in">' + head('AI lists') + '<div id="lsBody"></div><div class="dlgbtns" style="margin-top:14px"><button type="button" class="btn" data-close>Close</button></div></div>');
  function fill() {
    var ids = Object.keys(S.lists).sort(function (x, y) { return (S.lists[y].at || 0) - (S.lists[x].at || 0); });
    $('#lsBody', d).innerHTML = ids.length ? '<ul class="rows">' + ids.map(function (id) {
      var l = S.lists[id];
      return '<li class="nrow lone"><span class="pos"></span><div class="main"><b>' + esc(l.label) + '</b><small class="hint" style="display:block">' + plural((l.keys || []).length, 'name') +
        ', added by ' + esc(who(l.by)) + '</small></div><div class="mv" style="flex-direction:row"><button type="button" class="icon-btn" data-ren="' + esc(id) + '" aria-label="Rename">✎</button>' +
        '<button type="button" class="icon-btn" data-del="' + esc(id) + '" aria-label="Remove" style="color:var(--bad)">🗑</button></div></li>';
    }).join('') + '</ul>' : '<p class="hint">No AI lists.</p>';
  }
  fill();
  d.addEventListener('click', function (ev) {
    var r = ev.target.closest('[data-ren]'), x = ev.target.closest('[data-del]');
    if (r) {
      var id = r.getAttribute('data-ren'), t = prompt('New name for this list', S.lists[id].label);
      if (t && tidy(t)) change(function (s) { if (s.lists[id]) s.lists[id].label = tidy(t).slice(0, 40); });
      fill();
    } else if (x) {
      var lid = x.getAttribute('data-del'), l = S.lists[lid];
      if (!confirm('Remove the list “' + l.label + '”? Its new names go too, unless one of you already liked them.')) return;
      change(function (s) {
        (l.keys || []).forEach(function (k) {
          var c = s.names[k]; if (!c || c.ai !== lid) return;
          var liked = s.votes.a[k] >= 1 || s.votes.b[k] >= 1;
          if (c.n && !own(CAT, k)) {
            if (!liked) { delete s.names[k]; delete s.votes.a[k]; delete s.votes.b[k]; delete s.notes[k]; delete s.rank[k]; } else delete c.ai;
          } else {                                  // a built-in name the list pointed to: keep only its extra nicknames
            delete c.ai; delete c.by; delete c.at;
            if (!Array.isArray(c.alt) || !c.alt.length) delete s.names[k];
          }
        });
        delete s.lists[lid];
      });
      fill();
    }
  });
}

/* ------------------------------------------------------------------ events */
$app.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]'); if (!t || !$app.contains(t)) return;
  var k = t.getAttribute('data-k');
  switch (t.getAttribute('data-act')) {
    case 'retry': route(); break;
    case 'reload': location.reload(); break;
    case 'share': share(title(), shareUrl(CODE)); break;
    case 'hide-created': justCreated = false; render({}); break;
    case 'menu': openMenu(); break;
    case 'tab': setPref('view', t.getAttribute('data-v')); $('#view').innerHTML = ''; render({ force: true }); break;
    case 'switch': setPref('me', undefined); undoStack = []; render({}); break;
    case 'iam': setPref('me', t.getAttribute('data-slot')); render({ force: true }); break;
    case 'filters': openFilters(); break;
    case 'no': decide(-1); break;
    case 'yes': decide(1); break;
    case 'undo': undo(); break;
    case 'suggest': openSuggest(t.getAttribute('data-n') || ''); break;
    case 'ai': openAI(); break;
    case 'detail': openName(k, !!t.getAttribute('data-note')); break;
    case 'delnote': delNote(k, t.getAttribute('data-id')); break;
    case 'up': move(k, -1); break;
    case 'down': move(k, 1); break;
    case 'copy': copyText(listText()).then(function (ok) { toast(ok ? 'Copied. Paste it anywhere.' : 'Couldn’t copy. Try again.'); }); break;
  }
});
$app.addEventListener('change', function (ev) {
  if (ev.target.name === 'lg') { setPref('lg', ev.target.value); render({}); }
});
$app.addEventListener('input', function (ev) { if (ev.target.id === 'findBox') findNames(); });
$app.addEventListener('submit', function (ev) {
  if (ev.target.id === 'createForm') { ev.preventDefault(); submitCreate(ev.target); }
  else if (ev.target.id === 'joinForm') {
    ev.preventDefault();
    var n = tidy(ev.target.elements.nm.value).slice(0, 30);
    if (!n) { ev.target.querySelector('.err').textContent = 'Add your name.'; return; }
    setPref('me', 'b');
    if (!change(function (s) { s.p.b = n; })) setPref('me', undefined);
  }
});
document.addEventListener('keydown', function (ev) {
  if (!S || openDlgs.length || view() !== 'swipe' || /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ''))) return;
  if (ev.key === 'ArrowRight') { ev.preventDefault(); decide(1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); decide(-1); }
});
window.addEventListener('popstate', function () { justCreated = false; route(); });

window.__names = { key: key, findMatch: findMatch, parseImport: parseImport, aiPrompt: aiPrompt, deck: deck, ordered: ordered,
  state: function () { return S; }, count: function () { return CAT_KEYS.length; } };
route();
})();
</script>
