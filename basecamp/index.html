<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A63">
<meta name="description" content="A live map for your group, with waypoints and trails.">
<title>Basecamp</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/basecamp/maplibre/maplibre-gl.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED;
  --good:#23704A; --bad:#B8362F; --bad-t:#F8E1DF; --warn-t:#FBF0CC; --warn-line:#E5CB6B;
  --rec:#D63B30;
  --shadow:0 4px 14px rgba(20,42,34,.25);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --good:#6CC48F; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --rec:#F0645A; --shadow:0 4px 14px rgba(0,0,0,.55); color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --good:#6CC48F; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --rec:#F0645A; --shadow:0 4px 14px rgba(0,0,0,.55); color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
[hidden]{display:none !important}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px calc(48px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:20px;font-weight:800}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{color:var(--muted);font-size:14px}
.lede{margin:8px 0 18px;font-size:17px;color:var(--muted);max-width:46ch}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.4em}
.err:empty{min-height:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.fld{display:block;margin-bottom:16px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.fld small{display:block;color:var(--muted);margin-top:5px;font-size:13px}
input[type=text],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-size:17px}
textarea{min-height:80px;resize:vertical}
.pl-opt{font-weight:400;color:var(--muted)}
.state{text-align:center;padding:40px 8px}
.state .e{font-size:48px;line-height:1;margin-bottom:10px}
.state .lede{margin:8px auto 18px}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;min-height:44px}
.topnav a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.recent{margin-top:26px}
.recent h2{margin-bottom:8px}
.recent ul{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recent li+li{border-top:1px solid var(--line)}
.recent a{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;color:var(--ink);text-decoration:none}
.recent a .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;background:var(--brand-t);color:var(--brand);border-radius:999px;padding:2px 8px;white-space:nowrap}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors label{position:relative}
.colors input{position:absolute;opacity:0;pointer-events:none}
.colors span{display:block;width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.colors input:checked + span{box-shadow:0 0 0 3px var(--ink)}
.colors input:focus-visible + span{outline:3px solid var(--brand);outline-offset:3px}
.how{margin:18px 0 0;padding:0 0 0 20px;color:var(--muted);font-size:15px}
.how li{margin-bottom:6px}

/* ---------- the map screen (fills the visible height, measured into --app-h) ---------- */
body.in-map{height:100vh;height:var(--app-h,100vh);overflow:hidden;overscroll-behavior:none}
body.in-map #app{height:100%}
.mapview{position:relative;height:100%;display:flex;flex-direction:column}
.mbar{flex:none;display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--surface);border-bottom:1px solid var(--line);z-index:3;min-height:56px}
.mbar .back{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink);text-decoration:none;font-size:24px}
.mbar .ttl{flex:1;min-width:0}
.mbar h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.saving::before{background:#D9A520}
.sync.offline{color:var(--bad)}
.sync.offline::before{background:var(--bad)}
.ibtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ibtn svg{width:24px;height:24px}
#map{position:relative;flex:1;min-height:0;background:#dfe6e2}
.maplibregl-ctrl-attrib{font-size:11px}
.maplibregl-ctrl-bottom-left{bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column-reverse;align-items:flex-start}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0 0 6px 10px}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl.maplibregl-ctrl-attrib{max-width:calc(100vw - 86px) !important;box-sizing:border-box}

/* layer switch, floating buttons, bottom bar */
.leftcol{position:absolute;top:10px;left:10px;right:68px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.leftcol>*{pointer-events:auto}
.layers{display:flex;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:3px;gap:2px}
.layers button{min-height:40px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.layers button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.fabs{position:absolute;top:10px;right:10px;z-index:2;display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative}
.fab svg{width:26px;height:26px}
.fab[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
.fab .n{position:absolute;bottom:2px;font:800 9px/1 var(--body);letter-spacing:.05em}
#compass svg{transition:transform .15s linear}
.mefab{position:absolute;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:2}
.bbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:5px}
.bbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:12px;background:none;
  font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:2px}
.bbar button:active{background:var(--brand-t)}
.bbar svg{width:24px;height:24px}
.bbar button.rec{background:var(--rec);color:#fff}
.bbar button.rec .dotrec{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.bbar button.rec .dotrec{animation:none}}
.note{position:absolute;left:10px;right:10px;top:62px;z-index:2;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:14px;
  display:flex;gap:10px;align-items:center}
.note.warn{background:var(--warn-t);border:1px solid var(--warn-line)}
.note .t{flex:1;min-width:0}
.note .btn{flex:none}
.notes{align-self:stretch;display:grid;gap:8px}
.notes:empty{display:none}
.padbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:5px 10px;font-size:12px;font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.facts2{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 12px;font-size:15px}
.facts2 dt{color:var(--muted)}
.facts2 dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.notes .note{position:static}

/* picking a spot */
.cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:2;pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#D63B30;box-shadow:0 0 0 1.5px #fff}
.cross::before{left:21px;top:0;width:2px;height:44px}
.cross::after{top:21px;left:0;height:2px;width:44px}
.pickbar{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:3;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px}
.pickbar p{font-weight:600;margin-bottom:10px;text-align:center}
.pickbar .row{display:flex;gap:8px}
.pickbar .row .btn{flex:1}

/* markers */
.pm{width:64px;height:64px;pointer-events:auto;cursor:pointer}
.pm .cone{position:absolute;inset:0;transition:transform .15s linear}
.pm .dot{position:absolute;left:19px;top:19px;width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);
  display:grid;place-items:center;color:#fff;font:800 12px/1 var(--body);text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pm.me .dot{width:30px;height:30px;left:17px;top:17px}
.pm.stale .dot{filter:grayscale(.6);opacity:.7}
.pm.stale .cone{display:none}
.pm .lbl,.wp .lbl{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px/1.2 var(--body);color:#1F2A27;
  background:rgba(255,255,255,.92);padding:2px 7px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.25);max-width:160px;overflow:hidden;text-overflow:ellipsis}
.pm .lbl{top:50px}
.pm .lbl small{font-weight:500;color:#5D6B66}
.wp{width:30px;height:30px;cursor:pointer}
.wp .wd{position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#E0261B;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.wp .lbl{top:6px;left:24px;transform:none;font-size:11px;padding:1px 6px}
.wp.pending .wd{background:#F08A84}
#map.far .wp .lbl{display:none}
.row .ck{flex:none;width:44px;height:44px;display:grid;place-items:center}
.row .ck input{width:22px;height:22px;accent-color:var(--brand)}
.wrow{display:flex;align-items:center}
.wrow .row{flex:1;min-width:0}

/* sheets (bottom dialogs) */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:620px;max-height:calc(var(--app-h,100vh) - 40px);padding:0;border:0;border-radius:20px 20px 0 0;
  background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.3);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(10,20,16,.45)}
.sheet .in{padding:8px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead h2{flex:1;margin:0;font-size:21px;overflow-wrap:anywhere}
.shead .ibtn{background:var(--bg)}
.list{list-style:none;margin:0 0 12px;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.row:active{background:var(--brand-t)}
.row .sw{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:#fff;font:800 12px/1 var(--body)}
.row .em{flex:none;width:28px;text-align:center;font-size:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .tx small{display:block;color:var(--muted);font-size:13px}
.row .far{flex:none;text-align:right;font-weight:700;font-size:15px;white-space:nowrap}
.row .far small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.menu{display:grid;gap:8px;margin-bottom:12px}
.menu .btn{justify-content:flex-start;width:100%;padding:10px 16px;text-align:left}
.menu .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 8px 4px}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.toggle .tx{flex:1}
.toggle .tx small{display:block;color:var(--muted);font-size:13px}
.toggle input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:16px}
.icons label{position:relative}
.icons input{position:absolute;opacity:0;pointer-events:none}
.icons span{display:grid;place-items:center;height:46px;border:1px solid var(--line);border-radius:12px;font-size:22px;cursor:pointer}
.icons input:checked + span{border:2px solid var(--brand);background:var(--brand-t)}
.icons input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btns .btn{flex:1 1 auto}
.big{font:800 26px/1.1 var(--head);margin:2px 0}
.facts{color:var(--muted);font-size:14px;margin:4px 0 12px}
.wnote{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px;background:var(--bg);border-radius:10px;padding:10px 12px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.checks{display:grid;gap:8px;margin-bottom:12px}

/* pocket mode */
.pocket{position:fixed;inset:0;z-index:50;background:#000;color:#555;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(40px + env(safe-area-inset-bottom));
  touch-action:none;user-select:none;-webkit-user-select:none}
.pocket p{font-size:14px;margin-bottom:14px;text-align:center}
.pocket .hold{position:relative;width:min(320px,100%);min-height:60px;border:1px solid #333;border-radius:30px;background:#0b0b0b;color:#777;font:600 16px var(--body);overflow:hidden}
.pocket .hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#1d3a30}
.pocket .hold span{position:relative}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;font-size:15px;font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:370px){ .layers button{padding:0 9px;font-size:13px} .bbar button{font-size:11.5px} }
</style>
<script src="/lock.js"></script>
<script src="/keepawake.js"></script>
<script src="/nav.js"></script>
</head>

function openOwnTracks() {
  var me = meMember(), on = !!(S.me && S.me.ot), trail = !!(S.me && S.me.ot_trail);
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var last = me && me.ot_at ? fmtAgo(srvNow() - me.ot_at) : '';
  openSheet('ot', head('📡 Share with the screen off') +
    '<p class="hint" style="margin-bottom:12px">Basecamp can only share while it’s on your screen. The free <b>OwnTracks</b> app can keep sending your location to this map ' +
      'with the phone locked in your pocket. Everyone still uses Basecamp to see the map.</p>' +
    (on ? '<div class="note" style="position:static;margin-bottom:12px;flex-wrap:wrap"><div class="t"><b>On ' + (S.me.ot_until ? 'until ' + esc(fmtUntil(S.me.ot_until)) : 'until you stop it') + '.</b> ' +
        (last ? 'Last report from OwnTracks: ' + esc(last) + '.' : 'No report from OwnTracks yet. Open OwnTracks once and allow location.') +
        (S.me.ot_v === 2 && S.me.ot_until ? ' Then OwnTracks is switched to Quiet automatically.' : '') + '</div>' +
        '<div class="btns" style="width:100%;margin-top:6px"><button type="button" class="btn small" data-ext="today">Through today</button>' +
        '<button type="button" class="btn small" data-ext="3d">3 more days</button><button type="button" class="btn small" data-ext="week">A week</button>' +
        '<button type="button" class="btn small" data-ext="forever">Until I stop</button></div></div>' +
      (S.me.ot_v === 2 ? '' : '<div class="note warn" style="position:static;margin-bottom:12px"><div class="t"><b>Set up OwnTracks again</b> (button below) so Pebbly can switch it off ' +
        'on its own when sharing ends. Your current setup can’t be switched off from here.</div></div>') : '') +
    '<ol class="how" style="margin:0 0 14px;color:var(--ink)">' +
      '<li><b>Install OwnTracks</b> (free): <a href="' + (ios ? OT_IOS : OT_PLAY) + '" target="_blank" rel="noopener">' + (ios ? 'App Store' : 'Play Store') + '</a>.</li>' +
      '<li><b>Tap “Set up OwnTracks”</b> below. OwnTracks opens with everything filled in. Tap to accept the settings.</li>' +
      '<li><b>Allow location “All the time”</b> when OwnTracks asks' + (ios ? '' : ', and in Android Settings → Apps → OwnTracks → Battery, choose <b>Unrestricted</b>') + '.</li></ol>' +
    (on ? '' : '<span class="lbl">Share for</span><div class="seg" style="grid-template-columns:1fr 1fr" role="group" aria-label="How long">' +
      '<button type="button" data-dur="today">Through today</button><button type="button" data-dur="3d" aria-pressed="true">3 days</button>' +
      '<button type="button" data-dur="week">A week</button><button type="button" data-dur="forever">Until I stop</button></div>' +
      '<p class="hint" style="margin:-4px 0 12px" id="otDurHint">When it ends, Pebbly switches OwnTracks to Quiet so it stops sending, even if someone forgets.</p>') +
    '<label class="toggle"><span class="tx">Record my trail while the screen is off<small>Draws a trail from OwnTracks’ reports. A new trail starts after 30 minutes without moving.</small></span>' +
      '<input type="checkbox" id="otTrail"' + (trail ? ' checked' : '') + '></label>' +
    '<p class="err" id="otErr" role="alert"></p>' +
    '<div class="btns"><a class="btn primary" id="otGo" href="#">' + (on ? 'Set up OwnTracks again' : 'Set up OwnTracks') + '</a></div>' +
    '<div class="btns" style="margin-top:8px"><button type="button" class="btn small" id="otFile">Download settings file instead</button>' +
      (on ? '<button type="button" class="btn small danger" id="otStop">Stop screen-off sharing</button>' : '') + '</div>' +
    '<p class="hint" style="margin-top:12px">How often it updates: OwnTracks starts in “Significant” mode (about every minute or 20 yards while moving; ' +
      'easy on the battery). In OwnTracks, switch to <b>Move</b> mode for updates every few seconds (uses more battery). ' +
      'If nobody opens this map for 12 hours, Pebbly tells OwnTracks to report less often (about every half mile or half hour); ' +
      'when someone opens it, each phone speeds back up at its next report. ' +
      (on ? 'Setting up again makes a new link; the old one stops working.' : '') + '</p>' +
    '<p class="hint" style="margin-top:8px"><b>One map at a time:</b> OwnTracks holds one setup, so setting it up from another Basecamp map moves it there, ' +
      'and this map stops getting your updates.</p>' +
    '<p class="hint" style="margin-top:8px">OwnTracks only sends to Pebbly. To pause it, open OwnTracks and choose <b>Quiet</b> mode, or tap Stop here.</p>', function (d) {
    var err = $('#otErr', d), dur = '3d';
    $$('[data-dur]', d).forEach(function (b) { b.onclick = function () {
      dur = b.dataset.dur; $$('[data-dur]', d).forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      $('#otDurHint', d).textContent = dur === 'forever' ? 'It keeps going until you tap Stop here (or leave the map, or the map is deleted); then Pebbly switches OwnTracks to Quiet.' :
        'When it ends, Pebbly switches OwnTracks to Quiet so it stops sending, even if someone forgets.';
    }; });
    $$('[data-ext]', d).forEach(function (b) {
      b.onclick = function () {
        err.textContent = '';
        rpc('bc_ot_extend', { p_code: CODE, p_member: ME.key, p_minutes: otMinutes(b.dataset.ext) }).then(function (r) {
          if (S.me) S.me.ot_until = r.until;
          toast(r.until ? 'Screen-off sharing on until ' + fmtUntil(r.until) + '.' : 'Screen-off sharing on until you stop it.'); closeSheet(); openOwnTracks();
        }, function (e) { err.textContent = friendly(e); });
      };
    });
    function link() {
      return rpc('bc_ot_link', { p_code: CODE, p_member: ME.key, p_trail: $('#otTrail', d).checked, p_minutes: otMinutes(on ? '3d' : dur) }).then(function (r) {
        if (S.me) { S.me.ot = true; S.me.ot_trail = $('#otTrail', d).checked; S.me.ot_until = r.until; S.me.ot_v = 2; }
        return otConfig(r.token, r.tid);
      });
    }
    $('#otGo', d).onclick = function (ev) {
      ev.preventDefault(); err.textContent = '';
      var a = ev.currentTarget; a.textContent = 'Setting up…';
      link().then(function (cfg) {
        a.href = otLink(cfg); a.textContent = 'Open OwnTracks';
        a.onclick = null;
        location.href = a.href;
        setTimeout(function () { if (document.visibilityState === 'visible') toast('If OwnTracks didn’t open, install it first, then tap Open OwnTracks.'); }, 1800);
      }, function (e) { a.textContent = 'Set up OwnTracks'; err.textContent = friendly(e); });
    };
    $('#otFile', d).onclick = function () {
      err.textContent = '';
      link().then(function (cfg) {
        var blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/octet-stream' }), u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u; a.download = 'basecamp.otrc'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
        toast('Saved basecamp.otrc. In OwnTracks: Preferences → Configuration management → Import.');
      }, function (e) { err.textContent = friendly(e); });
    };
    $('#otTrail', d).onchange = function () {
      if (!(S.me && S.me.ot)) return;
      var c = this.checked;
      rpc('bc_ot_set', { p_code: CODE, p_member: ME.key, p_trail: c }).then(function () { if (S.me) S.me.ot_trail = c; toast(c ? 'OwnTracks will record your trail too.' : 'OwnTracks won’t record trails.'); },
        function (e) { err.textContent = friendly(e); });
    };
    if ($('#otStop', d)) $('#otStop', d).onclick = function () {
      if (!confirm('Stop screen-off sharing for this map? Reports from OwnTracks will be ignored. (You can uninstall OwnTracks or set it to Quiet too.)')) return;
      rpc('bc_ot_stop', { p_code: CODE, p_member: ME.key }).then(function () {
        if (S.me) { S.me.ot = false; S.me.ot_trail = false; } closeSheet(); syncSoon(); toast('Screen-off sharing stopped.');
      }, function (e) { err.textContent = friendly(e); });
    };
  });
}

/* ------------------------------------------------------------------ pocket mode */
var pocketEl = null;
function openPocket() {
  closePocket();
  var el = pocketEl = document.createElement('div');
  el.className = 'pocket'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Pocket mode');
  el.innerHTML = '<p>Pocket mode: still sharing your location' + (REC ? ' and recording your trail' : '') + '.</p>' +
    '<button type="button" class="hold"><i></i><span>Press and hold to unlock</span></button>';
  document.body.appendChild(el);
  var btn = el.querySelector('.hold'), bar = btn.querySelector('i'), t = null, t0 = 0, raf = null;
  function down(e) { e.preventDefault(); t0 = Date.now(); step(); }
  function step() {
    var k = Math.min(1, (Date.now() - t0) / 1200); bar.style.width = k * 100 + '%';
    if (k >= 1) { closePocket(); return; }
    raf = requestAnimationFrame(step);
  }
  function up() { cancelAnimationFrame(raf); bar.style.width = '0'; }
  btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
function closePocket() { if (pocketEl) { pocketEl.remove(); pocketEl = null; } }

/* ================================================================== leaving the screen */
document.addEventListener('visibilitychange', function () {
  if (screen !== 'map') return;
  if (document.visibilityState === 'hidden') {
    if (REC) stopTrail('leave');
    stopGeo(); saveView();
    if (S) { clearTimeout(snapT); snapT = null; saveSnapshotSoon(); }
    try { syncCall().catch(function () {}); } catch (e) {}
  } else {
    startGeo(); renderNotes(); syncCall().catch(syncErr);
  }
});
window.addEventListener('pagehide', function () { if (screen === 'map' && REC) stopTrail('leave'); saveView(); });

window.__bc = {
  state: function () { return S; }, map: function () { return MAP; }, fix: function () { return FIX; }, rec: function () { return REC; },
  mode: function () { return MODE; }, otMinutes: otMinutes, otConfig: otConfig, otLink: otLink, syncEvery: function () { return syncEvery(); }, seenMax: SEEN_MAX,
  idleNow: function () { lastMoveAt = 0; }, padShown: function () { return padShown; }, drawnTrails: function () { return drawnTrails; }, fromPhone: function () { return fromPhone; }, heading: headingNow, queue: function () { return queue(CODE); }, areas: areas,
  areaPlan: areaPlan, areaTiles: areaTiles, fmtDist: fmtDist, dir8: dir8, layers: LAYERS, tileKey: tileKey,
  orient: onOrient, sync: function () { return syncCall(); }
};
route();
})();
