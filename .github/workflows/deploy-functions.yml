# Deploys the Supabase Edge Functions in supabase/functions/ (phone alerts: notify-push) whenever they
# change on main, or by hand from the Actions tab ("Run workflow").
# Needs one repository secret, SUPABASE_ACCESS_TOKEN (see supabase/README.md → Edge Functions).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy notify-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (see supabase/README.md), then run this again."
            exit 1
          fi
          supabase functions deploy notify-push --project-ref xujtuijpbwujduuzlwat --no-verify-jwt
