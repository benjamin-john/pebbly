<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A63">
<meta name="description" content="Baby log, contraction timer, kick counter and baby names.">
<title>Little Ones</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED;
  --good:#23704A; --good-t:#DCEFE3; --bad:#B8362F; --bad-t:#F8E1DF; --warn-t:#FBF0CC; --warn-line:#E5CB6B;
  --feed:#C06A1B; --feed-t:#FBEBDC; --diaper:#2A64A0; --diaper-t:#E1EDF8; --sleep:#6A4FB0; --sleep-t:#ECE6F8;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31;
    --good:#6CC48F; --good-t:#1C3326; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --feed:#F0A868; --feed-t:#3A2A1C; --diaper:#8DBDF0; --diaper-t:#1E2C3D; --sleep:#B9A4F0; --sleep-t:#2A2440; color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31;
    --good:#6CC48F; --good-t:#1C3326; --bad:#F07A75; --bad-t:#3A2120; --warn-t:#3A3218; --warn-line:#6B5A22;
    --feed:#F0A868; --feed-t:#3A2A1C; --diaper:#8DBDF0; --diaper-t:#1E2C3D; --sleep:#B9A4F0; --sleep-t:#2A2440; color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);overflow-x:hidden}
[hidden]{display:none !important}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font-size:20px;font-weight:800}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{color:var(--muted);font-size:14px}
.lede{margin:8px 0 18px;font-size:17px;color:var(--muted);max-width:46ch}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.4em}
.err:empty{min-height:0;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.danger{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.wide{width:100%}
.link{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--brand);font-weight:600;cursor:pointer;font-size:15px}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card>h2{margin-bottom:10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cardhead h2{margin:0}
.fld{display:block;margin-bottom:16px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.fld small{display:block;color:var(--muted);margin-top:5px;font-size:13px}
.pl-opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],input[type=time],select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:17px}
textarea{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font-size:17px;resize:vertical}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
legend{font-weight:600;font-size:15px;margin-bottom:6px;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg label{position:relative;display:flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:0 4px;font-size:15px}
.seg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg input:focus-visible + span{outline:3px solid var(--brand)}
.opts{display:grid;gap:8px}
.opt{position:relative;display:flex}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600}
.opt input:checked + span{border:2px solid var(--brand);background:var(--brand-t);padding:5px 13px}
.opt input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.when{margin-bottom:16px}
.when input{margin-top:8px}

/* ---------- top of a page ---------- */
.topnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;min-height:44px}
.topnav a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none}
.topnav .r{display:flex;align-items:center;gap:12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.saving::before{background:#D9A520}
.sync.offline{color:var(--bad)}
.sync.offline::before{background:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.banner{background:var(--warn-t);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.banner.urgent{background:var(--bad-t);border-color:var(--bad)}
.created{background:var(--brand-t);border-color:var(--brand)}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;min-width:0;font-size:15px}
.recent{margin-top:26px}
.recent h2{margin-bottom:8px}
.recent ul{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recent li+li{border-top:1px solid var(--line)}
.recent a{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px;color:var(--ink);text-decoration:none}
.recent a .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;background:var(--brand-t);color:var(--brand);border-radius:999px;padding:2px 8px;white-space:nowrap}
.state{text-align:center;padding:40px 8px}
.state .e{font-size:48px;line-height:1;margin-bottom:10px}
.state .lede{margin:8px auto 18px}
.apphead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.apphead h1{flex:1;min-width:0;font-size:26px}
.sub{color:var(--muted);font-size:15px;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{min-height:46px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink)}

/* ---------- pregnancy ---------- */
.hero{text-align:center;padding:20px 16px}
.hero .big{font:800 40px/1.05 var(--head)}
.hero .fruit{font-size:44px;line-height:1;margin:10px 0 4px}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:999px}
.kickbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:150px;border:0;border-radius:18px;
  background:var(--brand);color:var(--brand-ink);font:800 28px/1.1 var(--head);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kickbtn small{font:600 16px var(--body);opacity:.9;margin-top:6px}
.kickbtn:active{transform:scale(.98)}

/* ---------- contractions ---------- */
.ctwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.ctbtn{width:190px;height:190px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font:800 30px/1.1 var(--head);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 24px rgba(20,42,34,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ctbtn.on{background:var(--bad);color:#fff}
.ctbtn small{font:600 18px var(--body);font-variant-numeric:tabular-nums}
.ctbtn:active{transform:scale(.97)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:4px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font:800 22px/1.1 var(--head);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.rule{border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600;background:var(--bg)}
.rule.met{background:var(--bad-t);color:var(--bad);border:1px solid var(--bad)}

/* ---------- baby log ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;min-width:0}
.tile .k{font-size:13px;font-weight:700;color:var(--muted)}
.tile b{display:block;font:800 20px/1.15 var(--head);margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile small{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.feed .k{color:var(--feed)} .tile.diaper .k{color:var(--diaper)} .tile.sleep .k{color:var(--sleep)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bigbtn{display:flex;align-items:center;gap:10px;min-height:72px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);
  font:800 20px var(--head);color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:left}
.bigbtn .e{font-size:28px;line-height:1}
.bigbtn:active{transform:scale(.98)}
.bigbtn.feed{background:var(--feed-t);border-color:transparent} .bigbtn.diaper{background:var(--diaper-t);border-color:transparent}
.bigbtn.sleep{background:var(--sleep-t);border-color:transparent}
.run{background:var(--brand-t);border-color:var(--brand)}
.run .clock{font:800 34px/1.1 var(--head);font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.side{min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:800 18px var(--head);color:var(--ink);touch-action:manipulation}
.side span{font:600 22px var(--body);font-variant-numeric:tabular-nums}
.side small{font:600 12px var(--body);color:var(--muted)}
.side[aria-pressed=true]{border-color:var(--feed);background:var(--feed-t)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.totals div{background:var(--bg);border-radius:12px;padding:10px 4px}
.totals b{display:block;font:800 20px/1.15 var(--head);font-variant-numeric:tabular-nums}
.totals span{font-size:13px;color:var(--muted)}
.totals small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tl li+li{border-top:1px solid var(--line)}
.tl button{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.tl .t{flex:none;width:64px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tl .i{flex:none;font-size:20px;width:26px;text-align:center}
.tl .x{flex:1;min-width:0;overflow-wrap:anywhere}
.tl .w{flex:none;font-size:12px;color:var(--muted)}
.tl .empty{padding:14px;color:var(--muted)}
.sec{margin:0 0 18px}
.sec>h2{font-size:13px;font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px 4px}
.days{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.days th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:4px 6px}
.days th:first-child,.days td:first-child{text-align:left}
.days td{padding:9px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.days .bar{display:inline-block;height:8px;border-radius:999px;background:var(--sleep);vertical-align:middle;margin-right:6px}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.day>summary{list-style:none;padding:0 14px;font-weight:700}
details.day>summary::-webkit-details-marker{display:none}
details.day .tl{border:0;border-top:1px solid var(--line);border-radius:0 0 14px 14px}
details>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--brand);font-weight:600}
.namecard{display:flex;align-items:center;gap:14px}
.namecard .e{font-size:40px;line-height:1}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- dialogs ---------- */
dialog.dlg{width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);padding:0;border:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(10,20,16,.55)}
.dlg>form,.dlg>.in{padding:16px}
.dlghead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dlghead h2{flex:1;margin:0;font-size:22px;overflow-wrap:anywhere}
.dlghead .icon-btn{border:0;background:var(--bg)}
.dlgbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dlgbtns .btn{flex:1 1 auto}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;width:100%;padding:10px 16px;text-align:left}
.menu .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.menu h3{font-size:13px;font-family:var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 0 4px}
.diapers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.diapers button{min-height:84px;border-radius:14px;border:1px solid var(--line);background:var(--diaper-t);color:var(--ink);font:800 17px var(--head);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
.diapers button .e{font-size:26px;line-height:1}
.diapers button[aria-pressed=true]{border:2px solid var(--diaper)}
.prompt{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;overflow-wrap:anywhere;max-height:260px;overflow:auto}

/* ---------- night alarm (always dark) ---------- */
#night{position:fixed;inset:0;z-index:15;background:#050807;color:#8FA39B;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto}
#night .nclock{font:800 76px/1 var(--head);color:#B8C9C2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#night .nnext{font-size:19px}
#night .nnext b{color:#D6E3DE}
#night .nbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#night button{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid #26332E;background:#0E1512;color:#9FB3AB;font:600 16px var(--body);cursor:pointer}
#night .nlink{border:0;background:none;color:#6E8A7F;text-decoration:underline;min-height:44px}
#night .nhint{font-size:13px;color:#5F7269;max-width:36ch}
#night .narm{background:#3A3218;color:#F2D98A;border-radius:12px;padding:10px 14px;font-weight:600}
#night.ring{background:#2F7A63;color:#fff;animation:nflash 1s steps(2) infinite}
#night.ring .nclock,#night.ring .nnext b{color:#fff}
#night .nup{min-height:96px !important;min-width:240px;font:800 30px var(--head) !important;background:#fff !important;color:#1F2A27 !important;border:0 !important}
@keyframes nflash{50%{background:#1F5545}}
@media (prefers-reduced-motion:reduce){#night.ring{animation:none}}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;background:var(--ink);color:var(--bg);
  padding:6px 8px 6px 16px;border-radius:12px;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:8px;min-height:44px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast:not(.act){padding-right:16px}
#toast button{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:359px){ h1{font-size:26px} .hero .big{font-size:34px} .tile b{font-size:17px} .ctbtn{width:170px;height:170px} }
</style>
<script src="/keepawake.js"></script>
<script src="/lock.js"></script>
<script src="/doc.js"></script>
<script src="/notify.js"></script>
<script src="/nav.js"></script>
</head>
<body>
<main id="app" class="wrap"><p class="hint">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">This page needs JavaScript to work.</p></noscript>
<script>
(function () {
'use strict';
// Little Ones: baby log, contraction timer, kick counter and the couple's Baby Names shortlist, in one shared space.
// The space IS a Baby Names shortlist (plan_docs kind 'names', doc.js): the same link (?d=), password and host, and
// /babynames/?d= opens its names. Settings live in the document under "lo". Log entries are rows of their own
// (lo_sync, supabase/migrations/20261125000000_little_ones.sql): this phone keeps a copy (pebbly_little_cache) and a

// One day's totals (from midnight).
function totals(from) {
  var to = from + DAY, now = Date.now(), t = { feeds: 0, breast: 0, bottle: 0, bottles: 0, pumped: 0, wet: 0, dirty: 0, diapers: 0, sleep: 0, naps: 0 };
  entries(null, from - DAY, to).forEach(function (x) {
    var inDay = x.at >= from && x.at < to, d = x.d || {};
    if (x.k === 'sleep') {
      var end = typeof x.end === 'number' ? x.end : Math.min(now, x.at + DAY), a = Math.max(x.at, from), b = Math.min(end, to, now);
      if (b > a) t.sleep += b - a;
      if (inDay) t.naps++;
      return;
    }
    if (!inDay) return;
    if (x.k === 'feed') { t.feeds++; var s = feedSecs(x); t.breast += (s.l + s.r) * 1000; }
    else if (x.k === 'bottle') { t.feeds++; t.bottles++; t.bottle += amtIn(d.amt, d.unit); }
    else if (x.k === 'pump') t.pumped += amtIn((d.l || 0) + (d.r || 0), d.unit);
    else if (x.k === 'diaper') { t.diapers++; if (d.wet) t.wet++; if (d.dirty) t.dirty++; }

}
// Contractions: last hour's numbers, and whether the rule (5-1-1: 5 min apart or closer, about a minute long, for an

function contractions() { return entries('contraction').filter(function (x) { return typeof x.end === 'number'; }); }
function pattern(r) {
  var list = contractions(); if (!list.length) return null;
  var lastC = list[list.length - 1], gap = Number((r || rule()).charAt(0));
  var w = list.filter(function (x) { return x.at > lastC.at - 61 * MIN && x.at <= lastC.at; });
  if (w.length < 3) return null;
  var span = lastC.at - w[0].at, apart = span / (w.length - 1), len = w.reduce(function (s, x) { return s + (x.end - x.at); }, 0) / w.length;
  if (span < 55 * MIN || apart > gap * MIN + 30000 || len < 50000) return null;

}

    else if (k === 'copy-host') copyText(PebblyDoc.ownerLink(CODE)).then(function (ok) { toast(ok ? 'Host link copied. Keep it private.' : 'Couldn’t copy. Try again.'); });
    else if (k === 'lock') PebblyLock.openHost({ app: 'doc', code: CODE, owner: PebblyDoc.owner(CODE), raw: PebblyDoc.raw, what: 'list', toast: toast });
    else if (k === 'delete') {
      if (!confirm('Delete everything for both of you: the whole baby log and your Baby Names shortlist? This can’t be undone.')) return;
      D.remove().then(function () {
        forgetSpace(CODE); var c = cacheAll(); delete c[CODE]; store(K_CACHE, c); setQueue({});
        if (window.PebblyNotify) PebblyNotify.drop('little', CODE);
        D = null; history.pushState(null, '', baseUrl()); route(); toast('Deleted.');
      }, function (e) { toast(friendly(e)); });
    }
  });
}

/* ------------------------------------------------------------------ events */
$app.addEventListener('submit', function (ev) {
  var f = ev.target;
  if (f.id === 'createForm') { ev.preventDefault(); submitCreate(f); }
  else if (f.id === 'joinForm') {
    ev.preventDefault();
    var nm = tidy(f.nm.value).slice(0, 30);
    if (!nm) { $('.err', f).textContent = 'Add your name.'; return; }
    setPref('me', 'b');
    D.change(function (s) { normalize(s); s.p.b = nm; });
  } else if (f.id === 'dueForm') {
    ev.preventDefault();
    if (!dateOnly(f.due.value)) { toast('Pick the due date.'); return; }
    setLo({ due: f.due.value }); toast('Saved.');
  }
});
$app.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  switch (a) {
    case 'retry': case 'reload': location.reload(); break;
    case 'iam': setPref('me', b.getAttribute('data-slot')); render({}); break;
    case 'tab': setUi('tab', b.getAttribute('data-v')); render({}); window.scrollTo(0, 0); break;
    case 'menu': openMenu(); break;
    case 'share': shareLink(); break;
    case 'hide-created': justCreated = false; render({}); break;
    case 'settings': openSettings(); break;
    case 'born': openBorn(); break;
    case 'entry': openEntry(b.getAttribute('data-id')); break;
    case 'kick-start': startTimer('kicks', Date.now(), { n: 0 }); break;
    case 'kick': case 'kick-undo': {
      var kr = running('kicks', 2 * HOUR); if (!kr) break;
      var y = JSON.parse(JSON.stringify(kr)); y.d.n = Math.max(0, (y.d.n || 0) + (a === 'kick' ? 1 : -1));
      if (navigator.vibrate && a === 'kick') try { navigator.vibrate(30); } catch (e) {}
      put(y); break;
    }
    case 'kick-done': { var k2 = running('kicks', 2 * HOUR); if (!k2) break; var z = JSON.parse(JSON.stringify(k2)); z.end = Date.now(); put(z, plural(z.d.n || 0, 'kick') + ' in ' + dur(z.end - z.at) + '. Saved.'); break; }
    case 'kick-cancel': { var k3 = running('kicks', 2 * HOUR); if (k3) remove(k3.id, 'Count cancelled.'); break; }
    case 'ct': contractionTap(); break;
    case 'ct-earlier': { var cr = running('contraction', 10 * MIN); if (!cr) break; var c = JSON.parse(JSON.stringify(cr)); c.at -= 15000; put(c); break; }
    case 'water': openWater(); break;
    case 'feed': openFeed(); break;
    case 'feed-side': feedSide(b.getAttribute('data-side')); break;
    case 'feed-done': feedDone(); break;
    case 'diaper': openDiaper(); break;
    case 'sleep': openSleep(); break;
    case 'wake': wake(); break;
    case 'more': openMore(); break;
    case 'remind': openRemind(); break;
    case 'night': nightOn(); break;
    case 'ai': openAI(); break;
    case 'doctor': openDoctor(); break;
    case 'days': setUi('days', ui().days === 30 ? 7 : 30); render({}); break;
  }
});
window.addEventListener('popstate', route);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { sync(); render({}); } });
window.addEventListener('online', function () { sync(); });
window.addEventListener('pebbly-notify-new', function () { sync(); });
setInterval(function () { if (document.visibilityState === 'visible') sync(); }, 3000);

// for tests
window.__lo = { entries: function () { return JSON.parse(JSON.stringify(E)); }, state: function () { return S && JSON.parse(JSON.stringify(S)); },
  pattern: pattern, totals: totals, aiPrompt: function (k, kinds, days) { return aiPrompt(ASKS[k], kinds || ASKS[k].kinds, days || ASKS[k].days); },
  doctorText: doctorText, put: put, alarm: function () { return { on: NA.on, ringing: NA.ringing, at: alarmAt() }; }, sync: sync, queue: function () { return queue(); } };
route();
})();
