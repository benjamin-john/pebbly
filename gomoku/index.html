<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7A63">
<title>Gomoku</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#DDE4E1; --field:#B4C2BC;
  --brand:#2F7A63; --brand-ink:#FFFFFF; --brand-t:#E6F2ED; --lead:#F2C230; --lead-t:#FBF0CC; --no:#CC423D; --no-t:#F6DAD8;
  --wood:#E4C28A; --wood-line:#7A5A2E; --win:#CC423D;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --lead:#E3B23C; --lead-t:#3A3218; --no:#F07A75; --no-t:#3D2221;
    --wood:#B8955C; --wood-line:#4A3519; --win:#E0453F; color-scheme:dark; }
}
:root[data-theme=dark]{--bg:#141A18; --surface:#1D2522; --ink:#E3EBE8; --muted:#9AABA5; --line:#2C3833; --field:#3E4C46;
    --brand:#6CC4A4; --brand-ink:#0F1F19; --brand-t:#1F3A31; --lead:#E3B23C; --lead-t:#3A3218; --no:#F07A75; --no-t:#3D2221;
    --wood:#B8955C; --wood-line:#4A3519; --win:#E0453F; color-scheme:dark; }
:root[data-theme=light]{color-scheme:light;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font:800 28px/1.15 var(--head);margin:8px 0 4px}
h2{font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.lead{margin:0 0 16px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 14px;border:0;border-radius:12px;
  background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:17px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:center;line-height:1.15}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input[type=text]{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--ink);font:500 17px/1.2 var(--body)}
.icon-btn{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--ink);font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.x{color:var(--no)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.stack{display:grid;gap:10px}

/* ---------- Setup ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes.three{grid-template-columns:1fr 1fr 1fr}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:center;min-height:48px}
.mode input{position:absolute;opacity:0}
.mode b{font-size:16px}
.mode small{color:var(--muted);font-size:13px;line-height:1.3}
.mode:has(input:checked){border:2px solid var(--brand);background:var(--brand-t)}
.mode:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.opt{margin-top:14px}
.opt>span{display:block;font-weight:600;margin-bottom:8px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:flex;gap:6px;align-items:center}
.plist .num{width:22px;flex:none;text-align:center}
.plist input{flex:1;min-width:0}
.plist .bot{flex:1;min-height:48px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--field);border-radius:10px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.addrow .btn{width:auto;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px;overflow:hidden}
.chip .add{padding:0 6px 0 12px;min-height:36px;border:0;background:none;cursor:pointer;font-weight:500}
.chip .add::before{content:"+ ";color:var(--brand);font-weight:700}
.chip .forget{width:32px;min-height:36px;border:0;background:none;color:var(--muted);cursor:pointer}
.rules{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.rules li{margin:5px 0}

/* ---------- Play ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.topbar .title{flex:1;min-width:0}
.topbar h1{font-size:24px;margin:0}
.topbar .sub{color:var(--muted);font-size:13.5px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.pl.cur{border:2px solid var(--brand);background:var(--brand-t)}
.pl .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.pl .wins{font:800 20px/1 var(--head);font-variant-numeric:tabular-nums}
.chipstone{flex:none;width:22px;height:22px;border-radius:50%}
.chipstone.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.chipstone.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 70%);border:1px solid #aaa}
.status{min-height:26px;margin:0 0 8px;font-weight:600;text-align:center}
.status.good{color:var(--brand)}

.boardwrap{background:var(--wood);border-radius:14px;padding:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);touch-action:manipulation}
.board{display:grid;width:100%;aspect-ratio:1/1;user-select:none;-webkit-user-select:none}
.pt{all:unset;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt::before,.pt::after{content:"";position:absolute;background:var(--wood-line)}
.pt::before{left:0;right:0;top:50%;height:1px}
.pt::after{top:0;bottom:0;left:50%;width:1px}
.pt.l::before{left:50%}.pt.r::before{right:50%}.pt.t::after{top:50%}.pt.bm::after{bottom:50%}
.pt i{position:absolute;inset:6%;border-radius:50%;z-index:1}
.pt.star i:not(.s){inset:38%;background:var(--wood-line)}
.pt i.s.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.pt i.s.w{background:radial-gradient(circle at 35% 30%,#fff,#d6d6d6 70%);box-shadow:0 1px 2px rgba(0,0,0,.45)}
.pt i.s.ghost{opacity:.5}
.pt.last i.s::after{content:"";position:absolute;inset:34%;border-radius:50%;border:2px solid var(--win)}
.pt.win i.s{box-shadow:0 0 0 2px var(--win),0 1px 2px rgba(0,0,0,.45)}
.pt.sel::before,.pt.sel::after{background:var(--win);z-index:0}
.pt:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.acts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.ps-wait{margin-top:12px}

/* dialogs */
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 40px);padding:0;border:0;border-radius:18px;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,16,.55)}
.dlg{padding:16px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dlghead h3{flex:1;margin:0;font:800 22px/1.2 var(--head)}
.final{list-style:none;margin:0 0 6px;padding:0}
.final li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:17px}
.final .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final .tt{font:800 20px/1 var(--head)}
.final small{color:var(--muted);font-size:13px}
</style>
<script src="/keepawake.js"></script>
<script src="/play/sync.js"></script>
<script src="/nav.js"></script>
</head>
<body>

<!-- ================= Setup ================= -->
<main class="wrap" id="setup" hidden>
  <h1>Gomoku</h1>
  <p class="lead">Five in a row. Take turns placing stones; the first to line up five wins.</p>
  <div id="psJoin"></div>

  <section class="card">
    <h2>Opponent</h2>
    <div class="modes">
      <label class="mode"><input type="radio" name="vs" value="people" checked><b>👥 Each other</b><small>Two players</small></label>
      <label class="mode"><input type="radio" name="vs" value="bot"><b>🤖 Computer</b><small>Play against Pebbly</small></label>
    </div>
    <div class="opt" id="levelOpt" hidden>
      <span>Computer</span>
      <div class="modes">
        <label class="mode"><input type="radio" name="level" value="easy"><b>Easy</b></label>
        <label class="mode"><input type="radio" name="level" value="hard" checked><b>Hard</b></label>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Players</h2>
    <ul class="plist" id="setupPlayers"></ul>
    <form class="addrow" id="addPlayerForm" autocomplete="off">
      <input type="text" id="newPlayer" maxlength="16" placeholder="Add a player" enterkeyhint="done">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="chips" id="playerChips"></div>
    <p class="hint" id="playerHint"></p>
  </section>

  <section class="card">
    <h2>Board</h2>
    <div class="modes three">
      <label class="mode"><input type="radio" name="size" value="13"><b>13 × 13</b><small>Quick</small></label>
      <label class="mode"><input type="radio" name="size" value="15" checked><b>15 × 15</b><small>Standard</small></label>
      <label class="mode"><input type="radio" name="size" value="19"><b>19 × 19</b><small>Go board</small></label>
    </div>
    <div class="opt">
      <span>To win</span>
      <div class="modes">
        <label class="mode"><input type="radio" name="rule" value="free" checked><b>Five or more</b><small>Six in a row wins too</small></label>
        <label class="mode"><input type="radio" name="rule" value="exact"><b>Exactly five</b><small>Six in a row doesn’t count</small></label>
      </div>
    </div>
  </section>

  <div id="psSetup"></div>
  <div class="stack">
    <button class="btn" id="startBtn" type="button">Start</button>
    <button class="btn ghost" id="backBtn" type="button" hidden>Back to current game</button>
  </div>
</main>

<!-- ================= Play ================= -->
<main class="wrap" id="play" hidden>
  <div class="topbar">
    <div class="title"><h1>Gomoku</h1><div class="sub" id="sub"></div></div>
    <button class="icon-btn" id="undoBtn" type="button" aria-label="Undo" title="Undo">↶</button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" title="Menu">☰</button>
  </div>
  <div id="psBadge" hidden></div>
  <div class="players" id="players"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="boardwrap"><div class="board" id="board" role="grid" aria-label="Board"></div></div>
  <div class="acts" id="acts"></div>
</main>

<!-- ================= Menu ================= -->
<dialog id="menuDlg">
  <div class="dlg">
    <div class="dlghead"><h3>Menu</h3><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <div class="stack">
      <button class="btn plain" type="button" id="mRestart">Play again, same players</button>
      <button class="btn plain" type="button" id="mSetup">Change players or board</button>
    </div>
    <h2 style="margin-top:16px">Rules</h2>
    <ul class="rules" id="menuRules"></ul>
  </div>
</dialog>

<dialog id="winDlg">
  <div class="dlg">
    <div class="dlghead"><h3 id="winTitle">Game over</h3><button class="icon-btn" type="button" data-close aria-label="Close">✕</button></div>
    <p id="winSub" class="hint" style="margin:0 0 8px"></p>
    <ol class="final" id="finalList"></ol>
    <div class="stack" style="margin-top:14px">
      <button class="btn" type="button" id="wRestart" autofocus>Play again</button>
      <button class="btn ghost" type="button" id="wSetup">Change players or board</button>
      <button class="btn plain" type="button" id="wUndo">Undo the last move</button>
    </div>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var KEY = 'pebbly_gomoku', K_UNDO = 'pebbly_gomoku_undo', K_SET = 'pebbly_gomoku_settings', K_MEM = 'pebbly_score_memory';
  var BOT = 'Computer';
  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function tidy(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms || 8); }
  function rnd(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

  // ================= State =================
  /* game = { n, rule:'free'|'exact', players:[{id,name,bot?}] (exactly 2 once everyone's in), level,
              black: index of the player with black (black moves first), moves:[cell index], tally:{pid:wins},
              over, win:{by, line:[cells]}|null }
     Whose turn it is and the board itself are worked out from the moves. */
  var game = load(KEY, null), undo = load(K_UNDO, []);
  var settings = load(K_SET, { vs: 'people', level: 'hard', n: 15, rule: 'free', players: [] });
  var mem = load(K_MEM, { players: [], games: [] }); if (!mem.players) mem.players = [];
  var sync = null, playFor = -1, sel = -1, botT = null;
  function save() { store(KEY, game); store(K_UNDO, undo); if (sync) sync.push(); }
  function snap() { undo.push(JSON.stringify(game)); if (undo.length > 400) undo.shift(); }
  function ready() { return game.players.length === 2; }
  function curIx() { return (game.black + game.moves.length) % 2; }
  function cur() { return ready() ? game.players[curIx()] : null; }
  function colorOf(ix) { return ix === game.black ? 'b' : 'w'; }
  function colorName(ix) { return ix === game.black ? 'Black' : 'White'; }
  function myTurn() {
    var p = cur(); if (!p || game.over || p.bot) return false;
    return PebblySync.canAct(p.id) || playFor === game.moves.length;
  }
  function grid(g) { var b = new Array(g.n * g.n).fill(0); g.moves.forEach(function (c, k) { b[c] = k % 2 ? 2 : 1; }); return b; }

  // ================= Rules =================
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  // The winning line through cell c (with color col on board b), or null.
  function winLine(b, n, c, col, rule) {
    var r = Math.floor(c / n), q = c % n;
    for (var d = 0; d < 4; d++) {
      var line = [c], dr = DIRS[d][0], dq = DIRS[d][1];
      for (var s = -1; s <= 1; s += 2) {
        for (var k = 1; k < n; k++) {
          var rr = r + dr * k * s, qq = q + dq * k * s;
          if (rr < 0 || rr >= n || qq < 0 || qq >= n || b[rr * n + qq] !== col) break;
          line.push(rr * n + qq);
        }
      }
      if (rule === 'exact' ? line.length === 5 : line.length >= 5) return line.sort(function (x, y) { return x - y; });
    }
    return null;
  }
  function place(c) {
    var b = grid(game); if (b[c] || game.over || !ready()) return;
    var ix = curIx(), col = game.moves.length % 2 ? 2 : 1;
    game.moves.push(c); b[c] = col;
    var line = winLine(b, game.n, c, col, game.rule);
    if (line) { game.over = true; game.win = { by: ix, line: line }; game.tally[game.players[ix].id] = (game.tally[game.players[ix].id] || 0) + 1; }
    else if (game.moves.length === game.n * game.n) { game.over = true; game.win = null; }
    sel = -1;
  }

  // ================= Computer =================
  // Scores every empty point near the stones: how strong a line it makes for the computer (attack)
  // and how strong a line it stops for the other player (defense).
  function lineValue(cnt, open, gap) {
    if (cnt >= 5) return gap ? 2000 : 1000000;
    if (cnt === 4) return open === 2 ? (gap ? 3000 : 50000) : open === 1 ? 4000 : 0;
    if (cnt === 3) return open === 2 ? (gap ? 2500 : 3000) : open === 1 ? 300 : 0;
    if (cnt === 2) return open === 2 ? 200 : open === 1 ? 30 : 0;
    return open === 2 ? 10 : open === 1 ? 2 : 0;
  }
  function pointScore(b, n, c, col) {
    var r = Math.floor(c / n), q = c % n, total = 0;
    for (var d = 0; d < 4; d++) {
      var cnt = 1, open = 0, gap = false;
      for (var s = -1; s <= 1; s += 2) {
        var k = 1, usedGap = false;
        while (true) {
          var rr = r + DIRS[d][0] * k * s, qq = q + DIRS[d][1] * k * s;
          if (rr < 0 || rr >= n || qq < 0 || qq >= n) break;
          var v = b[rr * n + qq];
          if (v === col) { cnt++; k++; continue; }
          if (v === 0) {
            // one gap allowed if our stone continues right after it (X X _ X)
            var r2 = rr + DIRS[d][0] * s, q2 = qq + DIRS[d][1] * s;
            if (!usedGap && r2 >= 0 && r2 < n && q2 >= 0 && q2 < n && b[r2 * n + q2] === col) { usedGap = gap = true; k++; continue; }
            open++;
          }
          break;
        }
      }
      total += lineValue(cnt, open, gap);
    }
    return total;
  }
  function botPick() {
    var n = game.n, b = grid(game), me = game.moves.length % 2 ? 2 : 1, them = 3 - me;
    if (!game.moves.length) return Math.floor(n / 2) * n + Math.floor(n / 2);
    var easy = game.level === 'easy', cands = [];
    for (var c = 0; c < b.length; c++) {
      if (b[c]) continue;
      var r = Math.floor(c / n), q = c % n, near = false;
      for (var dr = -2; dr <= 2 && !near; dr++) for (var dq = -2; dq <= 2; dq++) {
        var rr = r + dr, qq = q + dq;
        if (rr >= 0 && rr < n && qq >= 0 && qq < n && b[rr * n + qq]) { near = true; break; }
      }
      if (!near) continue;
      var a = pointScore(b, n, c, me), d = pointScore(b, n, c, them);
      var s = easy ? a + d * 0.35 : a * 1.1 + d;
      s += (n - Math.abs(r - n / 2) - Math.abs(q - n / 2)) * 0.01;   // nudge toward the middle
      cands.push({ c: c, s: s });
    }
    cands.sort(function (x, y) { return y.s - x.s; });
    if (easy) { var top = cands.slice(0, 5); return top[rnd(top.length)].c; }
    var best = cands.filter(function (x) { return x.s >= cands[0].s * 0.97; });
    return best[rnd(best.length)].c;
  }
  function botTurn() {
    clearTimeout(botT); botT = null;
    if (!game || game.over || !cur() || !cur().bot || $('play').hidden) return;
    if (PebblySync.active() && !PebblySync.isHost()) return;
    botT = setTimeout(function () {
      botT = null;
      if (!game || game.over || !cur() || !cur().bot) return;
      place(botPick()); buzz(15); save(); render();
    }, 550);
  }

  // ================= Setup =================
  var draft = [];
  function vs() { return document.querySelector('input[name=vs]:checked').value; }
  function maxHumans() { return vs() === 'bot' ? 1 : 2; }
  function openSetup() {
    var src = game || settings;
    var bot = !!(game ? game.players.some(function (p) { return p.bot; }) : settings.vs === 'bot');
    document.querySelector('input[name=vs][value=' + (bot ? 'bot' : 'people') + ']').checked = true;
    document.querySelector('input[name=level][value=' + (src.level || 'hard') + ']').checked = true;
    document.querySelector('input[name=size][value="' + (src.n || 15) + '"]').checked = true;
    document.querySelector('input[name=rule][value=' + (src.rule || 'free') + ']').checked = true;
    var names = game ? game.players.filter(function (p) { return !p.bot; }).map(function (p) { return p.name; }) : settings.players || [];
    draft = names.map(function (n) { return { id: uid(), name: n }; });
    $('backBtn').hidden = !(game && !game.over && ready());
    $('play').hidden = true; $('setup').hidden = false; keepAwake(false); clearTimeout(botT); scrollTo(0, 0);
    renderSetup();
  }
  function renderSetup() {
    var bot = vs() === 'bot', shared = !bot && sync && sync.shared(), max = maxHumans();
    $('levelOpt').hidden = !bot;
    $('psSetup').hidden = bot;
    if (bot && sync && sync.box && sync.box.shared()) sync.box.set(false);
    if (draft.length > max) draft.length = max;
    if (sync && sync.box) sync.box.redraw();
    var ul = $('setupPlayers'); ul.innerHTML = '';
    draft.forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="num" aria-hidden="true"><span class="chipstone ' + (i ? 'w' : 'b') + '" style="display:inline-block;width:18px;height:18px"></span></span>';
      var inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 16; inp.value = p.name;
      inp.setAttribute('aria-label', 'Player ' + (i + 1) + ' name');
      inp.addEventListener('change', function () { var v = tidy(inp.value); if (v) p.name = v; else inp.value = p.name; if (sync && sync.box) sync.box.redraw(); });
      li.appendChild(inp);
      [['↑', -1, 'Move up'], ['↓', 1, 'Move down']].forEach(function (m) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'icon-btn'; b.textContent = m[0];
        b.setAttribute('aria-label', m[2] + ' ' + p.name);
        var j = i + m[1]; b.disabled = j < 0 || j >= draft.length;
        b.addEventListener('click', function () { draft.splice(j, 0, draft.splice(i, 1)[0]); renderSetup(); });
        li.appendChild(b);
      });
      var x = document.createElement('button'); x.type = 'button'; x.className = 'icon-btn x'; x.textContent = '✕';
      x.setAttribute('aria-label', 'Remove ' + p.name);
      x.addEventListener('click', function () { draft.splice(i, 1); renderSetup(); });
      li.appendChild(x); ul.appendChild(li);
    });
    if (bot) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="num" aria-hidden="true"><span class="chipstone w" style="display:inline-block;width:18px;height:18px"></span></span><span class="bot">🤖 ' + BOT + '</span>';
      ul.appendChild(li);
    }
    var full = draft.length >= max;
    $('addPlayerForm').hidden = full;
    var taken = draft.map(function (p) { return p.name.toLowerCase(); });
    var left = full ? [] : mem.players.filter(function (n) { return taken.indexOf(n.toLowerCase()) < 0; }).slice(0, 16);
    var chips = $('playerChips'); chips.innerHTML = '';
    left.forEach(function (n) {
      var c = document.createElement('span'); c.className = 'chip';
      c.innerHTML = '<button type="button" class="add"></button><button type="button" class="forget" aria-label="Forget ' + esc(n) + '">×</button>';
      c.firstChild.textContent = n;
      c.firstChild.addEventListener('click', function () { if (draft.length < maxHumans()) draft.push({ id: uid(), name: n }); renderSetup(); });
      c.lastChild.addEventListener('click', function () { mem.players = mem.players.filter(function (x) { return x !== n; }); store(K_MEM, mem); renderSetup(); });
      chips.appendChild(c);
    });
    var need = shared ? 1 : max;
    $('playerHint').textContent = bot ? 'You play Black and go first in the first game; after that, whoever lost starts.'
      : shared ? (draft.length < 2 ? 'Just add yourself if the other player will join from their own phone.' : 'The first player is Black and goes first.')
      : 'The first player is Black and goes first.';
    var ok = draft.length >= need;
    $('startBtn').disabled = !ok;
    $('startBtn').textContent = ok ? 'Start' : bot ? 'Add your name' : 'Add ' + (need - draft.length) + ' more player' + (need - draft.length === 1 ? '' : 's');
  }
  document.querySelectorAll('input[name=vs]').forEach(function (r) { r.addEventListener('change', renderSetup); });
  $('psSetup').addEventListener('click', function () { setTimeout(renderSetup, 0); });
  $('addPlayerForm').addEventListener('submit', function (e) {
    e.preventDefault(); var v = tidy($('newPlayer').value); if (!v) return;
    if (draft.length < maxHumans()) draft.push({ id: uid(), name: v });
    $('newPlayer').value = ''; renderSetup(); if (!$('addPlayerForm').hidden) $('newPlayer').focus();
  });
  $('backBtn').addEventListener('click', showPlay);
  $('startBtn').addEventListener('click', function () {
    var pending = tidy($('newPlayer').value);
    if (pending && draft.length < maxHumans()) { draft.push({ id: uid(), name: pending }); $('newPlayer').value = ''; }
    var bot = vs() === 'bot', shared = !bot && sync.shared();
    if (draft.length < (shared ? 1 : maxHumans())) { renderSetup(); return; }
    if (game && !game.over && game.moves.length && !confirm('Start a new game? The current one will be cleared.')) return;
    var level = document.querySelector('input[name=level]:checked').value;
    var n = +document.querySelector('input[name=size]:checked').value, rule = document.querySelector('input[name=rule]:checked').value;
    settings = { vs: bot ? 'bot' : 'people', level: level, n: n, rule: rule, players: draft.map(function (p) { return p.name; }) };
    store(K_SET, settings);
    draft.slice().reverse().forEach(function (p) {
      var i = mem.players.findIndex(function (x) { return x.toLowerCase() === p.name.toLowerCase(); });
      if (i > -1) mem.players.splice(i, 1); mem.players.unshift(p.name);
    });
    mem.players.length = Math.min(mem.players.length, 40); store(K_MEM, mem);
    var players = draft.map(function (p) { return { id: uid(), name: p.name }; });
    if (bot) players.push({ id: 'bot', name: BOT, bot: true });
    newGame({ n: n, rule: rule, level: level, players: players, black: 0, tally: {} });
    sync.started(shared ? game.players[Math.min(sync.box.meIndex(), game.players.length - 1)] : null);
  });

  // ================= Game flow =================
  function newGame(cfg) {
    game = { n: cfg.n, rule: cfg.rule, level: cfg.level, players: cfg.players, black: cfg.black, moves: [], tally: cfg.tally || {}, over: false, win: null };
    undo = []; sel = -1; playFor = -1; save(); showPlay();
  }
  function restart() {
    if (!game.over && game.moves.length && !confirm('Start over with the same players?')) return;
    $('menuDlg').close(); if ($('winDlg').open) $('winDlg').close();
    // Whoever lost starts the next game (on a draw, the colors swap).
    var black = game.win ? 1 - game.win.by : 1 - game.black;
    newGame({ n: game.n, rule: game.rule, level: game.level, players: game.players, black: black, tally: game.tally });
  }

  // ================= Render =================
  function showPlay() {
    $('setup').hidden = true; $('play').hidden = false;
    keepAwake(true); render();
    if (game.over) setTimeout(showWinner, 100);
  }
  function render() {
    if (!game) return;
    var n = game.n, b = grid(game), p = cur(), mine = myTurn();
    if (!mine) sel = -1;
    $('undoBtn').disabled = !undo.length;
    $('sub').textContent = n + ' × ' + n + ' · ' + (game.rule === 'exact' ? 'exactly five' : 'five or more') + (game.players.some(function (q) { return q.bot; }) ? ' · ' + (game.level === 'easy' ? 'Easy' : 'Hard') : '');
    // players
    var ph = '';
    [0, 1].forEach(function (ix) {
      var q = game.players[ix];
      ph += '<div class="pl' + (p && q === p && !game.over ? ' cur' : '') + '"><span class="chipstone ' + colorOf(ix) + '"></span><span class="nm">' +
        (q ? esc(q.name) : '<i style="font-weight:500;color:var(--muted)">Waiting…</i>') + '<small>' + colorName(ix) + (q && PebblySync.me() === q.id ? ' · you' : '') + '</small></span>' +
        '<span class="wins" title="Games won">' + (q ? (game.tally[q.id] || 0) : '') + '</span></div>';
    });
    $('players').innerHTML = ph;
    // status
    var st = $('status'), msg = '';
    st.className = 'status';
    if (!ready()) msg = 'Waiting for the other player to join with the code…';
    else if (game.over) msg = game.win ? '🎉 ' + game.players[game.win.by].name + ' wins!' : 'Board full: it’s a draw.';
    else if (p.bot) msg = '🤖 ' + BOT + ' is thinking…';
    else msg = p.name + '’s turn (' + colorName(curIx()) + ')' + (sel > -1 ? ': tap again or press Place' : '');
    if (game.over && game.win) st.className = 'status good';
    st.textContent = msg;
    // board
    var last = game.moves.length ? game.moves[game.moves.length - 1] : -1, win = game.win ? game.win.line : [];
    var stars = starPoints(n), h = '', ghost = curIx() === game.black ? 'b' : 'w';
    for (var c = 0; c < n * n; c++) {
      var r = Math.floor(c / n), q = c % n, cls = 'pt';
      if (q === 0) cls += ' l'; if (q === n - 1) cls += ' r'; if (r === 0) cls += ' t'; if (r === n - 1) cls += ' bm';
      if (stars.indexOf(c) > -1) cls += ' star';
      if (c === last) cls += ' last';
      if (win.indexOf(c) > -1) cls += ' win';
      if (c === sel) cls += ' sel';
      var stone = b[c] ? '<i class="s ' + (b[c] === 1 ? 'b' : 'w') + '"></i>' : c === sel ? '<i class="s ghost ' + ghost + '"></i>' : stars.indexOf(c) > -1 ? '<i></i>' : '';
      h += '<button type="button" class="' + cls + '" data-c="' + c + '" aria-label="Row ' + (r + 1) + ', column ' + (q + 1) +
        (b[c] ? ', ' + (b[c] === 1 ? 'black' : 'white') : ', empty') + '"' + (b[c] || !mine ? ' tabindex="-1"' : '') + '>' + stone + '</button>';
    }
    var bd = $('board'); bd.style.gridTemplateColumns = 'repeat(' + n + ',1fr)'; bd.innerHTML = h;
    // actions
    var acts = '';
    if (game.over) acts = '<button class="btn" type="button" data-a="again">Play again</button>';
    else if (ready() && !p.bot && !mine) {
      var nm = esc(p.name);
      acts = '<div class="ps-wait">⏳ ' + nm + ' is playing on their phone.<br><button type="button" data-a="playfor">Play for ' + nm + ' from this phone</button></div>';
    } else if (ready() && mine) acts = '<button class="btn" type="button" data-a="place"' + (sel < 0 ? ' disabled' : '') + '>' + (sel < 0 ? 'Tap a point to place your stone' : 'Place stone') + '</button>';
    $('acts').innerHTML = acts;
    botTurn();
  }
  function starPoints(n) {
    var e = 3, m = Math.floor(n / 2), pts = [m * n + m];
    [e, n - 1 - e].forEach(function (r) { [e, n - 1 - e].forEach(function (q) { pts.push(r * n + q); }); });
    return pts;
  }

  // ================= Events =================
  $('board').addEventListener('click', function (e) {
    var t = e.target.closest('.pt'); if (!t || !myTurn()) return;
    var c = +t.dataset.c; if (grid(game)[c]) return;
    if (sel === c) { doPlace(); return; }
    sel = c; buzz(5); render();
  });
  function doPlace() {
    if (sel < 0 || !myTurn()) return;
    snap(); place(sel); buzz(game.over ? [40, 60, 120] : 15); save(); render();
    if (game.over) setTimeout(showWinner, 400);
  }
  $('acts').addEventListener('click', function (e) {
    var a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
    if (a.dataset.a === 'place') doPlace();
    else if (a.dataset.a === 'playfor') { playFor = game.moves.length; render(); }
    else if (a.dataset.a === 'again') restart();
  });
  $('undoBtn').addEventListener('click', function () {
    if (!undo.length) return; clearTimeout(botT);
    game = JSON.parse(undo.pop()); sel = -1; save(); buzz(); if ($('winDlg').open) $('winDlg').close(); render();
  });
  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });
  $('menuBtn').addEventListener('click', function () {
    $('menuRules').innerHTML = [
      'Players take turns placing one stone on an empty point. Black goes first.',
      'Line up <b>' + (game.rule === 'exact' ? 'exactly five' : 'five or more') + '</b> of your stones in a row (across, down or diagonally) to win.' +
        (game.rule === 'exact' ? ' A line of six or more doesn’t count.' : ''),
      'Tap a point to pick it, then tap it again (or press Place) to put your stone down.',
      'In the next game, whoever lost goes first.'
    ].map(function (r) { return '<li>' + r + '</li>'; }).join('');
    $('menuDlg').showModal();
  });
  $('mRestart').addEventListener('click', restart);
  $('wRestart').addEventListener('click', restart);
  $('mSetup').addEventListener('click', function () { $('menuDlg').close(); openSetup(); });
  $('wSetup').addEventListener('click', function () { $('winDlg').close(); openSetup(); });
  $('wUndo').addEventListener('click', function () { $('winDlg').close(); $('undoBtn').click(); });
  function showWinner() {
    if (!game.over || $('winDlg').open || $('play').hidden) return;
    $('winTitle').textContent = game.win ? '🎉 ' + game.players[game.win.by].name + ' wins!' : 'It’s a draw!';
    $('winSub').textContent = game.win ? 'Five in a row after ' + game.moves.length + ' stones.' : 'The board is full.';
    $('finalList').innerHTML = game.players.map(function (q, ix) {
      var w = game.tally[q.id] || 0;
      return '<li><span class="chipstone ' + colorOf(ix) + '"></span><span class="nm">' + esc(q.name) + '</span><span class="tt">' + w + ' <small>' + (w === 1 ? 'win' : 'wins') + '</small></span></li>';
    }).join('');
    $('wUndo').hidden = !undo.length;
    $('winDlg').showModal();
  }

  if (game && game.players && game.moves) showPlay(); else { game = null; openSetup(); }

  // Play together (see /play/sync.js).
  sync = PebblySync.wire('gomoku', {
    setupEl: $('psSetup'), joinEl: $('psJoin'), badgeEl: $('psBadge'),
    names: function () { return draft.map(function (p) { return p.name; }); },
    getGame: function () { return game; },
    setGame: function (g) { game = g; store(KEY, game); },
    clearUndo: function () { undo = []; store(K_UNDO, undo); },
    render: function () { if (game && !$('play').hidden) render(); },
    showPlay: showPlay,
    players: function (g) { return (g.players || []).filter(function (p) { return !p.bot; }); },
    addPlayer: function (g, id, name) { if (g.players.length < 2) g.players.push({ id: id, name: name }); },
    onRemote: function (prev, next) {
      if (!prev || !next) return;
      if (next.moves.length !== prev.moves.length) { sel = -1; buzz(15); }
      if (!prev.over && next.over) setTimeout(showWinner, 300);
      if (prev.over && !next.over && $('winDlg').open) $('winDlg').close();
    }
  });
  renderSetup();

  // Exposed for automated checks only.
  window.__gomoku = { winLine: winLine, botPick: botPick, game: function () { return game; } };
})();
</script>
